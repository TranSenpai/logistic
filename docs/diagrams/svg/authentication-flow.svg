<svg xmlns="http://www.w3.org/2000/svg" width="1064" height="1520" viewBox="0 0 1064 1520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"><rect width="1064" height="1520" fill="#FFFFFF"/><defs><marker id="solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#37474F"/></marker><marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#37474F" stroke-width="1.4"/></marker></defs><text x="48" y="32" font-size="19" font-weight="600" fill="#263238">Luồng xác thực và phân quyền</text><text x="48" y="54" font-size="12.5" fill="#607D8B">Hai đường đăng nhập, rồi tới bước kiểm quyền khi gọi endpoint quản trị.</text><rect x="66" y="150" width="732" height="920" rx="4" fill="#FAFAFA" fill-opacity="0.55" stroke="#90A4AE" stroke-width="1.2"/><path d="M 66 150 h 46 l 12 12 v 8 h -58 z" fill="#ECEFF1" stroke="#90A4AE" stroke-width="1.2"/><text x="74" y="164" font-size="11" font-weight="700" fill="#37474F">alt</text><text x="132" y="164" font-size="11" fill="#455A64">[đăng nhập bằng email + mật khẩu]</text><line x1="66" y1="368" x2="798" y2="368" stroke="#90A4AE" stroke-width="1.1" stroke-dasharray="5 4"/><text x="74" y="382" font-size="11" fill="#455A64">[đăng nhập bằng Google OAuth2]</text><rect x="66" y="806" width="732" height="264" rx="4" fill="#FAFAFA" fill-opacity="0.55" stroke="#90A4AE" stroke-width="1.2"/><path d="M 66 806 h 46 l 12 12 v 8 h -58 z" fill="#ECEFF1" stroke="#90A4AE" stroke-width="1.2"/><text x="74" y="820" font-size="11" font-weight="700" fill="#37474F">alt</text><text x="132" y="820" font-size="11" fill="#455A64">[state lệch hoặc thiếu cookie]</text><line x1="66" y1="868" x2="798" y2="868" stroke="#90A4AE" stroke-width="1.1" stroke-dasharray="5 4"/><text x="74" y="882" font-size="11" fill="#455A64">[state khớp]</text><rect x="66" y="1290" width="932" height="160" rx="4" fill="#FAFAFA" fill-opacity="0.55" stroke="#90A4AE" stroke-width="1.2"/><path d="M 66 1290 h 46 l 12 12 v 8 h -58 z" fill="#ECEFF1" stroke="#90A4AE" stroke-width="1.2"/><text x="74" y="1304" font-size="11" font-weight="700" fill="#37474F">alt</text><text x="132" y="1304" font-size="11" fill="#455A64">[role ≠ admin]</text><line x1="66" y1="1352" x2="998" y2="1352" stroke="#90A4AE" stroke-width="1.1" stroke-dasharray="5 4"/><text x="74" y="1366" font-size="11" fill="#455A64">[role = admin]</text><line x1="132" y1="128" x2="132" y2="1496" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="332" y1="128" x2="332" y2="1496" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="532" y1="128" x2="532" y2="1496" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="732" y1="128" x2="732" y2="1496" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="932" y1="128" x2="932" y2="1496" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="6 5"/><rect x="526" y="236" width="12" height="52" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="326" y="184" width="12" height="156" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="326" y="392" width="12" height="190" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="326" y="686" width="12" height="154" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="531" y="892" width="12" height="104" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="326" y="1100" width="12" height="224" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="926" y="1376" width="12" height="52" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="526" y="444" width="12" height="1002" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="726" y="634" width="12" height="812" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="731" y="944" width="12" height="502" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><line x1="138" y1="184" x2="326" y2="184" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="232" y="177" font-size="11.5" fill="#263238" text-anchor="middle">1. POST /auth/login</text><line x1="338" y1="236" x2="526" y2="236" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="432" y="229" font-size="11.5" fill="#263238" text-anchor="middle">2. Login(email, password)</text><line x1="526" y1="288" x2="338" y2="288" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="7 4" marker-end="url(#open)"/><text x="432" y="281" font-size="11.5" fill="#263238" text-anchor="middle">3. TokenPair · hoặc Unauthenticated</text><line x1="326" y1="340" x2="138" y2="340" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="7 4" marker-end="url(#open)"/><text x="232" y="333" font-size="11.5" fill="#263238" text-anchor="middle">4. 200 { access_token } · hoặc 401</text><line x1="138" y1="392" x2="326" y2="392" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="232" y="385" font-size="11.5" fill="#263238" text-anchor="middle">5. GET /auth/google/login</text><line x1="338" y1="444" x2="526" y2="444" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="432" y="437" font-size="11.5" fill="#263238" text-anchor="middle">6. GetGoogleLoginURL(state)</text><polyline points="338,496 384,496 384,522 344,522" fill="none" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="394" y="502" font-size="11.5" fill="#263238">7. Set-Cookie oauth_state (HttpOnly, 5 phút)</text><line x1="326" y1="582" x2="138" y2="582" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="7 4" marker-end="url(#open)"/><text x="232" y="575" font-size="11.5" fill="#263238" text-anchor="middle">8. 307 → accounts.google.com</text><line x1="138" y1="634" x2="726" y2="634" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="432" y="627" font-size="11.5" fill="#263238" text-anchor="middle">9. đăng nhập + đồng ý</text><line x1="726" y1="686" x2="338" y2="686" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="532" y="679" font-size="11.5" fill="#263238" text-anchor="middle">10. GET /callback?code=…&amp;state=…</text><polyline points="338,738 384,738 384,764 344,764" fill="none" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="394" y="744" font-size="11.5" fill="#263238">11. so state trên URL ↔ cookie</text><text x="394" y="759" font-size="10.5" font-style="italic" fill="#78909C">cookie chỉ có trên máy người khởi tạo</text><line x1="326" y1="840" x2="138" y2="840" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="7 4" marker-end="url(#open)"/><text x="232" y="833" font-size="11.5" fill="#263238" text-anchor="middle">12. 400 INVALID_OAUTH_STATE</text><line x1="338" y1="892" x2="526" y2="892" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="432" y="885" font-size="11.5" fill="#263238" text-anchor="middle">13. GoogleCallback(code)</text><line x1="538" y1="944" x2="726" y2="944" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="632" y="937" font-size="11.5" fill="#263238" text-anchor="middle">14. đổi code lấy token (client_secret)</text><line x1="526" y1="996" x2="338" y2="996" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="7 4" marker-end="url(#open)"/><text x="432" y="989" font-size="11.5" fill="#263238" text-anchor="middle">15. TokenPair</text><line x1="326" y1="1048" x2="138" y2="1048" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="7 4" marker-end="url(#open)"/><text x="232" y="1041" font-size="11.5" fill="#263238" text-anchor="middle">16. Set-Cookie + 307 về frontend</text><line x1="138" y1="1100" x2="326" y2="1100" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="232" y="1093" font-size="11.5" fill="#263238" text-anchor="middle">17. GET /api/v1/admin/users  (Bearer)</text><polyline points="338,1152 384,1152 384,1178 344,1178" fill="none" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="394" y="1158" font-size="11.5" fill="#263238">18. IdentityContext: đọc X-User-Id / X-User-Role</text><polyline points="338,1238 384,1238 384,1264 344,1264" fill="none" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="394" y="1244" font-size="11.5" fill="#263238">19. RequireRole(&quot;admin&quot;) — gắn ở CẤP GROUP</text><line x1="326" y1="1324" x2="138" y2="1324" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="7 4" marker-end="url(#open)"/><text x="232" y="1317" font-size="11.5" fill="#263238" text-anchor="middle">20. 403 PERMISSION_DENIED</text><line x1="338" y1="1376" x2="926" y2="1376" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="632" y="1369" font-size="11.5" fill="#263238" text-anchor="middle">21. AdminListUsers (gRPC)</text><line x1="926" y1="1428" x2="138" y2="1428" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="7 4" marker-end="url(#open)"/><text x="532" y="1421" font-size="11.5" fill="#263238" text-anchor="middle">22. 200 { users, pagination }</text><rect x="48" y="76" width="168" height="52" rx="7" fill="#E8EAF6" stroke="#5C6BC0" stroke-width="1.6"/><text x="132" y="106" font-size="12.8" font-weight="600" fill="#1A237E" text-anchor="middle">Người dùng</text><rect x="248" y="76" width="168" height="52" rx="7" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.6"/><text x="332" y="106" font-size="12.8" font-weight="600" fill="#0D47A1" text-anchor="middle">gateway_service</text><rect x="448" y="76" width="168" height="52" rx="7" fill="#E8F5E9" stroke="#43A047" stroke-width="1.6"/><text x="532" y="106" font-size="12.8" font-weight="600" fill="#1B5E20" text-anchor="middle">auth_service</text><rect x="648" y="76" width="168" height="52" rx="7" fill="#ECEFF1" stroke="#78909C" stroke-width="1.6"/><text x="732" y="106" font-size="12.8" font-weight="600" fill="#37474F" text-anchor="middle">Google OAuth2</text><rect x="848" y="76" width="168" height="52" rx="7" fill="#E8F5E9" stroke="#43A047" stroke-width="1.6"/><text x="932" y="106" font-size="12.8" font-weight="600" fill="#1B5E20" text-anchor="middle">service nội bộ</text></svg>