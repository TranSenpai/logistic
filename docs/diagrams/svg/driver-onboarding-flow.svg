<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="970" viewBox="0 0 1080 970" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"><rect width="1080" height="970" fill="#FFFFFF"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#546E7A"/></marker></defs><text x="40" y="30" font-size="19" font-weight="600" fill="#263238">Luồng tài xế gia nhập hệ thống</text><text x="40" y="52" font-size="12.5" fill="#607D8B">Bốn cửa kiểm duyệt trước khi một chiếc xe được phép nhận đơn.</text><polyline points="260,109 300,109" fill="none" stroke="#546E7A" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="520,109 560,109" fill="none" stroke="#546E7A" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="523" y="100" width="34" height="17" rx="3" fill="#FFFFFF" opacity="0.92"/><text x="540" y="112" font-size="11" fill="#455A64" text-anchor="middle">gRPC</text><polyline points="560,109 540,109 540,259 520,259" fill="none" stroke="#546E7A" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="505" y="175" width="70" height="17" rx="3" fill="#FFFFFF" opacity="0.92"/><text x="540" y="187" font-size="11" fill="#455A64" text-anchor="middle">hồ sơ rỗng</text><polyline points="520,259 820,259" fill="none" stroke="#546E7A" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="611" y="250" width="118" height="17" rx="3" fill="#FFFFFF" opacity="0.92"/><text x="670" y="262" font-size="11" fill="#455A64" text-anchor="middle">vào hàng đợi duyệt</text><polyline points="820,259 780,259" fill="none" stroke="#546E7A" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="560,259 540,259 540,409 520,409" fill="none" stroke="#546E7A" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="520,409 560,409" fill="none" stroke="#546E7A" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="523" y="400" width="34" height="17" rx="3" fill="#FFFFFF" opacity="0.92"/><text x="540" y="412" font-size="11" fill="#455A64" text-anchor="middle">gRPC</text><polyline points="560,409 540,409 540,559 520,559" fill="none" stroke="#546E7A" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="520,559 820,559" fill="none" stroke="#546E7A" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="611" y="550" width="118" height="17" rx="3" fill="#FFFFFF" opacity="0.92"/><text x="670" y="562" font-size="11" fill="#455A64" text-anchor="middle">vào hàng đợi duyệt</text><polyline points="820,559 780,559" fill="none" stroke="#546E7A" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="560,559 540,559 540,709 520,709" fill="none" stroke="#546E7A" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="520,709 560,709" fill="none" stroke="#546E7A" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="780,709 820,709" fill="none" stroke="#546E7A" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="786" y="700" width="28" height="17" rx="3" fill="#FFFFFF" opacity="0.92"/><text x="800" y="712" font-size="11" fill="#455A64" text-anchor="middle">đạt</text><polyline points="820,709 670,709 670,859 520,859" fill="none" stroke="#546E7A" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="40" y="70" width="220" height="78" rx="8" fill="#E8EAF6" stroke="#5C6BC0" stroke-width="1.6"/><text x="150" y="113" font-size="13.0" font-weight="600" fill="#1A237E" text-anchor="middle">Tài xế</text><rect x="300" y="70" width="220" height="78" rx="8" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.6"/><text x="410" y="105" font-size="13.0" font-weight="600" fill="#0D47A1" text-anchor="middle">1. Đăng ký tài khoản</text><text x="410" y="121" font-size="12.0" font-weight="400" fill="#0D47A1" text-anchor="middle">POST /users/register</text><rect x="560" y="70" width="220" height="78" rx="8" fill="#E8F5E9" stroke="#43A047" stroke-width="1.6"/><text x="670" y="105" font-size="13.0" font-weight="600" fill="#1B5E20" text-anchor="middle">user_service</text><text x="670" y="121" font-size="12.0" font-weight="400" fill="#1B5E20" text-anchor="middle">tạo users + driver_profiles</text><rect x="300" y="220" width="220" height="78" rx="8" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.6"/><text x="410" y="255" font-size="13.0" font-weight="600" fill="#0D47A1" text-anchor="middle">2. Nộp hồ sơ KYC</text><text x="410" y="271" font-size="12.0" font-weight="400" fill="#0D47A1" text-anchor="middle">PUT /users/{id}/driver-profile</text><rect x="820" y="220" width="220" height="78" rx="8" fill="#E8EAF6" stroke="#5C6BC0" stroke-width="1.6"/><text x="930" y="255" font-size="13.0" font-weight="600" fill="#1A237E" text-anchor="middle">Admin duyệt KYC</text><text x="930" y="271" font-size="12.0" font-weight="400" fill="#1A237E" text-anchor="middle">PUT /admin/kyc/{id}/review</text><rect x="560" y="220" width="220" height="78" rx="8" fill="#FFFDE7" stroke="#FBC02D" stroke-width="1.6"/><text x="670" y="263" font-size="13.0" font-weight="600" fill="#795548" text-anchor="middle">kyc_status = approved</text><rect x="300" y="370" width="220" height="78" rx="8" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.6"/><text x="410" y="405" font-size="13.0" font-weight="600" fill="#0D47A1" text-anchor="middle">3. Đăng ký xe</text><text x="410" y="421" font-size="12.0" font-weight="400" fill="#0D47A1" text-anchor="middle">POST /vehicles</text><rect x="560" y="370" width="220" height="78" rx="8" fill="#E8F5E9" stroke="#43A047" stroke-width="1.6"/><text x="670" y="405" font-size="13.0" font-weight="600" fill="#1B5E20" text-anchor="middle">vehicle_service</text><text x="670" y="421" font-size="12.0" font-weight="400" fill="#1B5E20" text-anchor="middle">tạo vehicles</text><rect x="300" y="520" width="220" height="78" rx="8" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.6"/><text x="410" y="555" font-size="13.0" font-weight="600" fill="#0D47A1" text-anchor="middle">4. Nộp giấy tờ xe</text><text x="410" y="571" font-size="12.0" font-weight="400" fill="#0D47A1" text-anchor="middle">POST /vehicles/{id}/documents</text><rect x="820" y="520" width="220" height="78" rx="8" fill="#E8EAF6" stroke="#5C6BC0" stroke-width="1.6"/><text x="930" y="555" font-size="13.0" font-weight="600" fill="#1A237E" text-anchor="middle">Admin duyệt giấy tờ</text><text x="930" y="571" font-size="12.0" font-weight="400" fill="#1A237E" text-anchor="middle">PUT /admin/vehicles/{id}/verify</text><rect x="560" y="520" width="220" height="78" rx="8" fill="#FFFDE7" stroke="#FBC02D" stroke-width="1.6"/><text x="670" y="555" font-size="13.0" font-weight="600" fill="#795548" text-anchor="middle">verification_status</text><text x="670" y="571" font-size="12.0" font-weight="400" fill="#795548" text-anchor="middle">= verified</text><rect x="300" y="670" width="220" height="78" rx="8" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.6"/><text x="410" y="705" font-size="13.0" font-weight="600" fill="#0D47A1" text-anchor="middle">5. Bật nhận đơn</text><text x="410" y="721" font-size="12.0" font-weight="400" fill="#0D47A1" text-anchor="middle">POST /drivers/{id}/availability</text><rect x="560" y="670" width="220" height="78" rx="8" fill="#FFFDE7" stroke="#FBC02D" stroke-width="1.6"/><text x="670" y="705" font-size="13.0" font-weight="600" fill="#795548" text-anchor="middle">Kiểm tra: đã duyệt?</text><text x="670" y="721" font-size="12.0" font-weight="400" fill="#795548" text-anchor="middle">không bảo dưỡng? toạ độ hợp lệ?</text><rect x="820" y="670" width="220" height="78" rx="8" fill="#FFF3E0" stroke="#FB8C00" stroke-width="1.6"/><text x="930" y="705" font-size="13.0" font-weight="600" fill="#E65100" text-anchor="middle">Redis GEO</text><text x="930" y="721" font-size="12.0" font-weight="400" fill="#E65100" text-anchor="middle">xe vào chỉ mục tìm kiếm</text><rect x="300" y="820" width="220" height="78" rx="8" fill="#E8EAF6" stroke="#5C6BC0" stroke-width="1.6"/><text x="410" y="863" font-size="13.0" font-weight="600" fill="#1A237E" text-anchor="middle">Sẵn sàng nhận đơn</text></svg>