<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="970" viewBox="0 0 1080 970" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"><rect width="1080" height="970" fill="#FFFFFF"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#546E7A"/></marker></defs><text x="40" y="30" font-size="19" font-weight="600" fill="#263238">Luồng GPS và tìm xe đang chạy</text><text x="40" y="52" font-size="12.5" fill="#607D8B">Postgres là nguồn sự thật; Redis GEO là chỉ mục tìm kiếm dựng lại được.</text><polyline points="260,109 300,109" fill="none" stroke="#546E7A" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="520,109 560,109" fill="none" stroke="#546E7A" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="780,109 820,109" fill="none" stroke="#546E7A" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="783" y="100" width="34" height="17" rx="3" fill="#FFFFFF" opacity="0.92"/><text x="800" y="112" font-size="11" fill="#455A64" text-anchor="middle">gRPC</text><polyline points="930,148 930,220" fill="none" stroke="#546E7A" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="820,259 800,259 800,409 780,409" fill="none" stroke="#546E7A" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="777" y="325" width="46" height="17" rx="3" fill="#FFFFFF" opacity="0.92"/><text x="800" y="337" font-size="11" fill="#455A64" text-anchor="middle">hợp lệ</text><polyline points="780,409 820,409" fill="none" stroke="#546E7A" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="774" y="400" width="52" height="17" rx="3" fill="#FFFFFF" opacity="0.92"/><text x="800" y="412" font-size="11" fill="#455A64" text-anchor="middle">đồng bộ</text><polyline points="560,409 520,409" fill="none" stroke="#546E7A" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="493" y="400" width="94" height="17" rx="3" fill="#FFFFFF" opacity="0.92"/><text x="540" y="412" font-size="11" fill="#455A64" text-anchor="middle">sau khi ghi DB</text><polyline points="300,409 260,409" fill="none" stroke="#546E7A" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="242" y="400" width="76" height="17" rx="3" fill="#FFFFFF" opacity="0.92"/><text x="280" y="412" font-size="11" fill="#455A64" text-anchor="middle">có → GEOADD</text><polyline points="260,709 300,709" fill="none" stroke="#546E7A" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="150,448 150,559 410,559 410,670" fill="none" stroke="#546E7A" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="242" y="550" width="76" height="17" rx="3" fill="#FFFFFF" opacity="0.92"/><text x="280" y="562" font-size="11" fill="#455A64" text-anchor="middle">đọc chỉ mục</text><polyline points="520,709 560,709" fill="none" stroke="#546E7A" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="780,709 820,709" fill="none" stroke="#546E7A" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="930,748 930,820" fill="none" stroke="#546E7A" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="150,748 150,820" fill="none" stroke="#546E7A" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="106" y="775" width="88" height="17" rx="3" fill="#FFFFFF" opacity="0.92"/><text x="150" y="787" font-size="11" fill="#455A64" text-anchor="middle">khi Redis lỗi</text><rect x="40" y="70" width="220" height="78" rx="8" fill="#E8EAF6" stroke="#5C6BC0" stroke-width="1.6"/><text x="150" y="105" font-size="13.0" font-weight="600" fill="#1A237E" text-anchor="middle">App tài xế</text><text x="150" y="121" font-size="12.0" font-weight="400" fill="#1A237E" text-anchor="middle">ping GPS vài giây/lần</text><rect x="300" y="70" width="220" height="78" rx="8" fill="#FFEBEE" stroke="#E53935" stroke-width="1.6"/><text x="410" y="105" font-size="13.0" font-weight="600" fill="#B71C1C" text-anchor="middle">Nginx</text><text x="410" y="121" font-size="12.0" font-weight="400" fill="#B71C1C" text-anchor="middle">rate-limit riêng 60r/s</text><rect x="560" y="70" width="220" height="78" rx="8" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.6"/><text x="670" y="105" font-size="13.0" font-weight="600" fill="#0D47A1" text-anchor="middle">gateway_service</text><text x="670" y="121" font-size="12.0" font-weight="400" fill="#0D47A1" text-anchor="middle">POST /vehicles/{id}/location</text><rect x="820" y="70" width="220" height="78" rx="8" fill="#E8F5E9" stroke="#43A047" stroke-width="1.6"/><text x="930" y="105" font-size="13.0" font-weight="600" fill="#1B5E20" text-anchor="middle">vehicle_service</text><text x="930" y="121" font-size="12.0" font-weight="400" fill="#1B5E20" text-anchor="middle">ReportLocation</text><rect x="820" y="220" width="220" height="78" rx="8" fill="#FFFDE7" stroke="#FBC02D" stroke-width="1.6"/><text x="930" y="255" font-size="13.0" font-weight="600" fill="#795548" text-anchor="middle">Kiểm tra toạ độ</text><text x="930" y="271" font-size="12.0" font-weight="400" fill="#795548" text-anchor="middle">chặn (0,0), NaN, ngoài ngưỡng</text><rect x="560" y="370" width="220" height="78" rx="8" fill="#FFF3E0" stroke="#FB8C00" stroke-width="1.6"/><text x="670" y="405" font-size="13.0" font-weight="600" fill="#E65100" text-anchor="middle">vehicle_locations</text><text x="670" y="421" font-size="12.0" font-weight="400" fill="#E65100" text-anchor="middle">ghi đè 1 dòng / xe</text><rect x="820" y="370" width="220" height="78" rx="8" fill="#FFF3E0" stroke="#FB8C00" stroke-width="1.6"/><text x="930" y="405" font-size="13.0" font-weight="600" fill="#E65100" text-anchor="middle">driver_availabilities</text><text x="930" y="421" font-size="12.0" font-weight="400" fill="#E65100" text-anchor="middle">đồng bộ toạ độ</text><rect x="300" y="370" width="220" height="78" rx="8" fill="#FFFDE7" stroke="#FBC02D" stroke-width="1.6"/><text x="410" y="405" font-size="13.0" font-weight="600" fill="#795548" text-anchor="middle">Tài xế đang bật</text><text x="410" y="421" font-size="12.0" font-weight="400" fill="#795548" text-anchor="middle">nhận đơn?</text><rect x="40" y="370" width="220" height="78" rx="8" fill="#FFF3E0" stroke="#FB8C00" stroke-width="1.6"/><text x="150" y="405" font-size="13.0" font-weight="600" fill="#E65100" text-anchor="middle">Redis GEO</text><text x="150" y="421" font-size="12.0" font-weight="400" fill="#E65100" text-anchor="middle">sorted set xe online</text><rect x="40" y="670" width="220" height="78" rx="8" fill="#E8F5E9" stroke="#43A047" stroke-width="1.6"/><text x="150" y="705" font-size="13.0" font-weight="600" fill="#1B5E20" text-anchor="middle">SearchNearbyVehicles</text><text x="150" y="721" font-size="12.0" font-weight="400" fill="#1B5E20" text-anchor="middle">(matching gọi sang)</text><rect x="300" y="670" width="220" height="78" rx="8" fill="#FFFDE7" stroke="#FBC02D" stroke-width="1.6"/><text x="410" y="705" font-size="13.0" font-weight="600" fill="#795548" text-anchor="middle">GEOSEARCH</text><text x="410" y="721" font-size="12.0" font-weight="400" fill="#795548" text-anchor="middle">bán kính, gần → xa</text><rect x="560" y="670" width="220" height="78" rx="8" fill="#FFFDE7" stroke="#FBC02D" stroke-width="1.6"/><text x="670" y="705" font-size="13.0" font-weight="600" fill="#795548" text-anchor="middle">2 truy vấn gộp</text><text x="670" y="721" font-size="12.0" font-weight="400" fill="#795548" text-anchor="middle">tránh N+1</text><rect x="820" y="670" width="220" height="78" rx="8" fill="#FFFDE7" stroke="#FBC02D" stroke-width="1.6"/><text x="930" y="705" font-size="13.0" font-weight="600" fill="#795548" text-anchor="middle">Lọc: đã duyệt · active</text><text x="930" y="721" font-size="12.0" font-weight="400" fill="#795548" text-anchor="middle">· đúng loại · đủ tải</text><rect x="820" y="820" width="220" height="78" rx="8" fill="#E8EAF6" stroke="#5C6BC0" stroke-width="1.6"/><text x="930" y="863" font-size="13.0" font-weight="600" fill="#1A237E" text-anchor="middle">Danh sách xe phù hợp</text><rect x="40" y="820" width="220" height="78" rx="8" fill="#FFFDE7" stroke="#FBC02D" stroke-width="1.6"/><text x="150" y="855" font-size="13.0" font-weight="600" fill="#795548" text-anchor="middle">Redis chết →</text><text x="150" y="871" font-size="12.0" font-weight="400" fill="#795548" text-anchor="middle">quét zone_id + haversine</text></svg>