<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="970" viewBox="0 0 1340 970" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"><rect width="1340" height="970" fill="#FFFFFF"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#546E7A"/></marker></defs><text x="40" y="30" font-size="19" font-weight="600" fill="#263238">Luồng chủ hàng đặt đơn tới khi chốt xe</text><text x="40" y="52" font-size="12.5" fill="#607D8B">Vòng thương lượng: bid → offer → accept/reject. Mỗi bước đều sinh thông báo.</text><polyline points="260,109 300,109" fill="none" stroke="#546E7A" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="520,109 560,109" fill="none" stroke="#546E7A" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="523" y="100" width="34" height="17" rx="3" fill="#FFFFFF" opacity="0.92"/><text x="540" y="112" font-size="11" fill="#455A64" text-anchor="middle">gRPC</text><polyline points="780,109 820,109" fill="none" stroke="#546E7A" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="771" y="100" width="58" height="17" rx="3" fill="#FFFFFF" opacity="0.92"/><text x="800" y="112" font-size="11" fill="#455A64" text-anchor="middle">RabbitMQ</text><polyline points="1040,109 1060,109 1060,259 1080,259" fill="none" stroke="#546E7A" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="1043" y="175" width="34" height="17" rx="3" fill="#FFFFFF" opacity="0.92"/><text x="1060" y="187" font-size="11" fill="#455A64" text-anchor="middle">push</text><polyline points="1080,259 1040,259" fill="none" stroke="#546E7A" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="820,259 780,259" fill="none" stroke="#546E7A" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="560,259 520,259" fill="none" stroke="#546E7A" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="511" y="250" width="58" height="17" rx="3" fill="#FFFFFF" opacity="0.92"/><text x="540" y="262" font-size="11" fill="#455A64" text-anchor="middle">RabbitMQ</text><polyline points="300,259 280,259 280,409 260,409" fill="none" stroke="#546E7A" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="263" y="325" width="34" height="17" rx="3" fill="#FFFFFF" opacity="0.92"/><text x="280" y="337" font-size="11" fill="#455A64" text-anchor="middle">push</text><polyline points="260,409 280,409 280,559 300,559" fill="none" stroke="#546E7A" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="248" y="475" width="64" height="17" rx="3" fill="#FFFFFF" opacity="0.92"/><text x="280" y="487" font-size="11" fill="#455A64" text-anchor="middle">không ưng</text><polyline points="520,559 560,559" fill="none" stroke="#546E7A" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="150,448 150,559 410,559 410,670" fill="none" stroke="#546E7A" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="257" y="550" width="46" height="17" rx="3" fill="#FFFFFF" opacity="0.92"/><text x="280" y="562" font-size="11" fill="#455A64" text-anchor="middle">đồng ý</text><polyline points="520,709 560,709" fill="none" stroke="#546E7A" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="523" y="700" width="34" height="17" rx="3" fill="#FFFFFF" opacity="0.92"/><text x="540" y="712" font-size="11" fill="#455A64" text-anchor="middle">gRPC</text><polyline points="780,709 820,709" fill="none" stroke="#546E7A" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="774" y="700" width="52" height="17" rx="3" fill="#FFFFFF" opacity="0.92"/><text x="800" y="712" font-size="11" fill="#455A64" text-anchor="middle">đủ tiền</text><polyline points="670,748 670,820" fill="none" stroke="#546E7A" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="629" y="775" width="82" height="17" rx="3" fill="#FFFFFF" opacity="0.92"/><text x="670" y="787" font-size="11" fill="#455A64" text-anchor="middle">tạo hợp đồng</text><polyline points="560,859 520,859" fill="none" stroke="#546E7A" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="511" y="850" width="58" height="17" rx="3" fill="#FFFFFF" opacity="0.92"/><text x="540" y="862" font-size="11" fill="#455A64" text-anchor="middle">RabbitMQ</text><rect x="40" y="70" width="220" height="78" rx="8" fill="#E8EAF6" stroke="#5C6BC0" stroke-width="1.6"/><text x="150" y="113" font-size="13.0" font-weight="600" fill="#1A237E" text-anchor="middle">Chủ hàng</text><rect x="300" y="70" width="220" height="78" rx="8" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.6"/><text x="410" y="105" font-size="13.0" font-weight="600" fill="#0D47A1" text-anchor="middle">1. Đăng đơn</text><text x="410" y="121" font-size="12.0" font-weight="400" fill="#0D47A1" text-anchor="middle">POST /matching/bids</text><rect x="560" y="70" width="220" height="78" rx="8" fill="#E8F5E9" stroke="#43A047" stroke-width="1.6"/><text x="670" y="105" font-size="13.0" font-weight="600" fill="#1B5E20" text-anchor="middle">matching_service</text><text x="670" y="121" font-size="12.0" font-weight="400" fill="#1B5E20" text-anchor="middle">lưu bid, tìm ask phù hợp</text><rect x="820" y="70" width="220" height="78" rx="8" fill="#F3E5F5" stroke="#8E24AA" stroke-width="1.6"/><text x="930" y="105" font-size="13.0" font-weight="600" fill="#4A148C" text-anchor="middle">Thông báo tài xế</text><text x="930" y="121" font-size="12.0" font-weight="400" fill="#4A148C" text-anchor="middle">&quot;có đơn gần bạn&quot;</text><rect x="1080" y="220" width="220" height="78" rx="8" fill="#E8EAF6" stroke="#5C6BC0" stroke-width="1.6"/><text x="1190" y="263" font-size="13.0" font-weight="600" fill="#1A237E" text-anchor="middle">Tài xế</text><rect x="820" y="220" width="220" height="78" rx="8" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.6"/><text x="930" y="255" font-size="13.0" font-weight="600" fill="#0D47A1" text-anchor="middle">2. Báo giá</text><text x="930" y="271" font-size="12.0" font-weight="400" fill="#0D47A1" text-anchor="middle">POST /matching/offers</text><rect x="560" y="220" width="220" height="78" rx="8" fill="#FFFDE7" stroke="#FBC02D" stroke-width="1.6"/><text x="670" y="255" font-size="13.0" font-weight="600" fill="#795548" text-anchor="middle">bid.status</text><text x="670" y="271" font-size="12.0" font-weight="400" fill="#795548" text-anchor="middle">= NEGOTIATING</text><rect x="300" y="220" width="220" height="78" rx="8" fill="#F3E5F5" stroke="#8E24AA" stroke-width="1.6"/><text x="410" y="255" font-size="13.0" font-weight="600" fill="#4A148C" text-anchor="middle">Thông báo chủ hàng</text><text x="410" y="271" font-size="12.0" font-weight="400" fill="#4A148C" text-anchor="middle">&quot;có báo giá mới&quot;</text><rect x="40" y="370" width="220" height="78" rx="8" fill="#E8EAF6" stroke="#5C6BC0" stroke-width="1.6"/><text x="150" y="413" font-size="13.0" font-weight="600" fill="#1A237E" text-anchor="middle">3. Chủ hàng quyết định</text><rect x="300" y="520" width="220" height="78" rx="8" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.6"/><text x="410" y="555" font-size="13.0" font-weight="600" fill="#0D47A1" text-anchor="middle">Từ chối</text><text x="410" y="571" font-size="12.0" font-weight="400" fill="#0D47A1" text-anchor="middle">POST /matching/offers/reject</text><rect x="560" y="520" width="220" height="78" rx="8" fill="#FFFDE7" stroke="#FBC02D" stroke-width="1.6"/><text x="670" y="555" font-size="13.0" font-weight="600" fill="#795548" text-anchor="middle">bid quay lại PENDING</text><text x="670" y="571" font-size="12.0" font-weight="400" fill="#795548" text-anchor="middle">tài xế khác tiếp tục ra giá</text><rect x="300" y="670" width="220" height="78" rx="8" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.6"/><text x="410" y="705" font-size="13.0" font-weight="600" fill="#0D47A1" text-anchor="middle">4. Chốt xe</text><text x="410" y="721" font-size="12.0" font-weight="400" fill="#0D47A1" text-anchor="middle">POST /matching/matches/accept</text><rect x="560" y="670" width="220" height="78" rx="8" fill="#E8F5E9" stroke="#43A047" stroke-width="1.6"/><text x="670" y="705" font-size="13.0" font-weight="600" fill="#1B5E20" text-anchor="middle">wallet_service</text><text x="670" y="721" font-size="12.0" font-weight="400" fill="#1B5E20" text-anchor="middle">CheckBalance</text><rect x="820" y="670" width="220" height="78" rx="8" fill="#F3E5F5" stroke="#8E24AA" stroke-width="1.6"/><text x="930" y="705" font-size="13.0" font-weight="600" fill="#4A148C" text-anchor="middle">Kafka wallet.hold_deposit</text><text x="930" y="721" font-size="12.0" font-weight="400" fill="#4A148C" text-anchor="middle">đóng băng tiền cọc</text><rect x="560" y="820" width="220" height="78" rx="8" fill="#FFF3E0" stroke="#FB8C00" stroke-width="1.6"/><text x="670" y="855" font-size="13.0" font-weight="600" fill="#E65100" text-anchor="middle">matches</text><text x="670" y="871" font-size="12.0" font-weight="400" fill="#E65100" text-anchor="middle">hợp đồng đã chốt</text><rect x="300" y="820" width="220" height="78" rx="8" fill="#F3E5F5" stroke="#8E24AA" stroke-width="1.6"/><text x="410" y="855" font-size="13.0" font-weight="600" fill="#4A148C" text-anchor="middle">Thông báo CẢ HAI</text><text x="410" y="871" font-size="12.0" font-weight="400" fill="#4A148C" text-anchor="middle">&quot;đã ghép được xe&quot;</text></svg>