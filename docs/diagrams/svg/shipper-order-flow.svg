<svg xmlns="http://www.w3.org/2000/svg" width="1664" height="1694" viewBox="0 0 1664 1694" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"><rect width="1664" height="1694" fill="#FFFFFF"/><defs><marker id="solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#37474F"/></marker><marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#37474F" stroke-width="1.4"/></marker></defs><text x="48" y="32" font-size="19" font-weight="600" fill="#263238">Luồng đặt đơn tới khi chốt xe</text><text x="48" y="54" font-size="12.5" fill="#607D8B">Vòng thương lượng: bid → offer → accept hoặc reject. Cọc được kiểm trước, đóng băng sau.</text><rect x="66" y="772" width="1532" height="852" rx="4" fill="#FAFAFA" fill-opacity="0.55" stroke="#90A4AE" stroke-width="1.2"/><path d="M 66 772 h 46 l 12 12 v 8 h -58 z" fill="#ECEFF1" stroke="#90A4AE" stroke-width="1.2"/><text x="74" y="786" font-size="11" font-weight="700" fill="#37474F">alt</text><text x="132" y="786" font-size="11" fill="#455A64">[chủ hàng từ chối giá]</text><line x1="66" y1="1024" x2="1598" y2="1024" stroke="#90A4AE" stroke-width="1.1" stroke-dasharray="5 4"/><text x="74" y="1038" font-size="11" fill="#455A64">[chủ hàng chốt xe]</text><rect x="66" y="1222" width="1532" height="402" rx="4" fill="#FAFAFA" fill-opacity="0.55" stroke="#90A4AE" stroke-width="1.2"/><path d="M 66 1222 h 46 l 12 12 v 8 h -58 z" fill="#ECEFF1" stroke="#90A4AE" stroke-width="1.2"/><text x="74" y="1236" font-size="11" font-weight="700" fill="#37474F">alt</text><text x="132" y="1236" font-size="11" fill="#455A64">[số dư không đủ]</text><line x1="66" y1="1284" x2="1598" y2="1284" stroke="#90A4AE" stroke-width="1.1" stroke-dasharray="5 4"/><text x="74" y="1298" font-size="11" fill="#455A64">[đủ tiền cọc]</text><line x1="132" y1="128" x2="132" y2="1670" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="332" y1="128" x2="332" y2="1670" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="532" y1="128" x2="532" y2="1670" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="732" y1="128" x2="732" y2="1670" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="932" y1="128" x2="932" y2="1670" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="1132" y1="128" x2="1132" y2="1670" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="1332" y1="128" x2="1332" y2="1670" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="1532" y1="128" x2="1532" y2="1670" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="6 5"/><rect x="726" y="1152" width="12" height="52" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="541" y="1100" width="12" height="156" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="326" y="184" width="12" height="1436" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="331" y="444" width="12" height="1176" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="336" y="806" width="12" height="814" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="341" y="1048" width="12" height="572" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="526" y="236" width="12" height="1384" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="531" y="496" width="12" height="1124" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><rect x="536" y="858" width="12" height="762" fill="#CFD8DC" stroke="#78909C" stroke-width="1"/><line x1="138" y1="184" x2="326" y2="184" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="232" y="177" font-size="11.5" fill="#263238" text-anchor="middle">1. POST /matching/bids</text><line x1="338" y1="236" x2="526" y2="236" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="432" y="229" font-size="11.5" fill="#263238" text-anchor="middle">2. SubmitBid</text><line x1="538" y1="288" x2="1126" y2="288" stroke="#37474F" stroke-width="1.5" marker-end="url(#open)"/><text x="832" y="281" font-size="11.5" fill="#263238" text-anchor="middle">3. matching.driver.candidates_found</text><line x1="1138" y1="340" x2="1326" y2="340" stroke="#37474F" stroke-width="1.5" marker-end="url(#open)"/><text x="1232" y="333" font-size="11.5" fill="#263238" text-anchor="middle">4. giao message</text><line x1="1338" y1="392" x2="1526" y2="392" stroke="#37474F" stroke-width="1.5" marker-end="url(#open)"/><text x="1432" y="385" font-size="11.5" fill="#263238" text-anchor="middle">5. push &quot;có đơn gần bạn&quot;</text><line x1="1526" y1="444" x2="338" y2="444" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="932" y="437" font-size="11.5" fill="#263238" text-anchor="middle">6. POST /matching/offers (giá 3.2tr)</text><line x1="338" y1="496" x2="526" y2="496" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="432" y="489" font-size="11.5" fill="#263238" text-anchor="middle">7. SubmitOffer</text><polyline points="538,548 584,548 584,574 544,574" fill="none" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="594" y="554" font-size="11.5" fill="#263238">8. bid.status = NEGOTIATING</text><text x="594" y="569" font-size="10.5" font-style="italic" fill="#78909C">khoá mềm: tài xế khác bị từ chối ngay</text><line x1="538" y1="650" x2="1126" y2="650" stroke="#37474F" stroke-width="1.5" marker-end="url(#open)"/><text x="832" y="643" font-size="11.5" fill="#263238" text-anchor="middle">9. matching.offer.received</text><line x1="1138" y1="702" x2="1326" y2="702" stroke="#37474F" stroke-width="1.5" marker-end="url(#open)"/><text x="1232" y="695" font-size="11.5" fill="#263238" text-anchor="middle">10. giao message</text><line x1="1326" y1="754" x2="138" y2="754" stroke="#37474F" stroke-width="1.5" marker-end="url(#open)"/><text x="732" y="747" font-size="11.5" fill="#263238" text-anchor="middle">11. push &quot;có báo giá mới&quot;</text><line x1="138" y1="806" x2="326" y2="806" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="232" y="799" font-size="11.5" fill="#263238" text-anchor="middle">12. POST /matching/offers/reject</text><line x1="338" y1="858" x2="526" y2="858" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="432" y="851" font-size="11.5" fill="#263238" text-anchor="middle">13. RejectOffer</text><polyline points="538,910 584,910 584,936 544,936" fill="none" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="594" y="916" font-size="11.5" fill="#263238">14. bid.status = PENDING (mở lại)</text><line x1="538" y1="996" x2="1126" y2="996" stroke="#37474F" stroke-width="1.5" marker-end="url(#open)"/><text x="832" y="989" font-size="11.5" fill="#263238" text-anchor="middle">15. matching.offer.rejected</text><line x1="138" y1="1048" x2="326" y2="1048" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="232" y="1041" font-size="11.5" fill="#263238" text-anchor="middle">16. POST /matching/matches/accept</text><line x1="338" y1="1100" x2="526" y2="1100" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="432" y="1093" font-size="11.5" fill="#263238" text-anchor="middle">17. AcceptMatch</text><line x1="538" y1="1152" x2="726" y2="1152" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="632" y="1145" font-size="11.5" fill="#263238" text-anchor="middle">18. CheckBalance(shipper_id)</text><line x1="726" y1="1204" x2="538" y2="1204" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="7 4" marker-end="url(#open)"/><text x="632" y="1197" font-size="11.5" fill="#263238" text-anchor="middle">19. balance</text><line x1="526" y1="1256" x2="138" y2="1256" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="7 4" marker-end="url(#open)"/><text x="332" y="1249" font-size="11.5" fill="#263238" text-anchor="middle">20. 422 INSUFFICIENT_BALANCE</text><line x1="538" y1="1308" x2="926" y2="1308" stroke="#37474F" stroke-width="1.5" marker-end="url(#open)"/><text x="732" y="1301" font-size="11.5" fill="#263238" text-anchor="middle">21. wallet.hold_deposit (đóng băng cọc 10%)</text><polyline points="538,1360 584,1360 584,1386 544,1386" fill="none" stroke="#37474F" stroke-width="1.5" marker-end="url(#solid)"/><text x="594" y="1366" font-size="11.5" fill="#263238">22. bid/ask = MATCHED · INSERT matches</text><line x1="538" y1="1446" x2="1126" y2="1446" stroke="#37474F" stroke-width="1.5" marker-end="url(#open)"/><text x="832" y="1439" font-size="11.5" fill="#263238" text-anchor="middle">23. matching.match.found</text><line x1="1138" y1="1498" x2="1326" y2="1498" stroke="#37474F" stroke-width="1.5" marker-end="url(#open)"/><text x="1232" y="1491" font-size="11.5" fill="#263238" text-anchor="middle">24. giao message</text><line x1="1326" y1="1550" x2="138" y2="1550" stroke="#37474F" stroke-width="1.5" marker-end="url(#open)"/><text x="732" y="1543" font-size="11.5" fill="#263238" text-anchor="middle">25. push &quot;đã tìm được xe&quot;</text><line x1="1338" y1="1602" x2="1526" y2="1602" stroke="#37474F" stroke-width="1.5" marker-end="url(#open)"/><text x="1432" y="1595" font-size="11.5" fill="#263238" text-anchor="middle">26. push &quot;bạn nhận được đơn&quot;</text><rect x="48" y="76" width="168" height="52" rx="7" fill="#E8EAF6" stroke="#5C6BC0" stroke-width="1.6"/><text x="132" y="106" font-size="12.8" font-weight="600" fill="#1A237E" text-anchor="middle">Chủ hàng</text><rect x="248" y="76" width="168" height="52" rx="7" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.6"/><text x="332" y="106" font-size="12.8" font-weight="600" fill="#0D47A1" text-anchor="middle">gateway_service</text><rect x="448" y="76" width="168" height="52" rx="7" fill="#E8F5E9" stroke="#43A047" stroke-width="1.6"/><text x="532" y="106" font-size="12.8" font-weight="600" fill="#1B5E20" text-anchor="middle">matching_service</text><rect x="648" y="76" width="168" height="52" rx="7" fill="#E8F5E9" stroke="#43A047" stroke-width="1.6"/><text x="732" y="106" font-size="12.8" font-weight="600" fill="#1B5E20" text-anchor="middle">wallet_service</text><rect x="848" y="76" width="168" height="52" rx="7" fill="#F3E5F5" stroke="#8E24AA" stroke-width="1.6"/><text x="932" y="106" font-size="12.8" font-weight="600" fill="#4A148C" text-anchor="middle">Kafka</text><rect x="1048" y="76" width="168" height="52" rx="7" fill="#F3E5F5" stroke="#8E24AA" stroke-width="1.6"/><text x="1132" y="106" font-size="12.8" font-weight="600" fill="#4A148C" text-anchor="middle">RabbitMQ</text><rect x="1248" y="76" width="168" height="52" rx="7" fill="#E8F5E9" stroke="#43A047" stroke-width="1.6"/><text x="1332" y="106" font-size="12.8" font-weight="600" fill="#1B5E20" text-anchor="middle">notification_service</text><rect x="1448" y="76" width="168" height="52" rx="7" fill="#E8EAF6" stroke="#5C6BC0" stroke-width="1.6"/><text x="1532" y="106" font-size="12.8" font-weight="600" fill="#1A237E" text-anchor="middle">Tài xế</text></svg>