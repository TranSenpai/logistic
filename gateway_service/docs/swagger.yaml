basePath: /
definitions:
  internal_controller.AcceptMatchReq:
    properties:
      ask_id:
        type: string
      bid_id:
        type: string
      consensus_price:
        type: number
    required:
    - ask_id
    - bid_id
    - consensus_price
    type: object
  internal_controller.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  internal_controller.RegisterRequest:
    properties:
      email:
        type: string
      full_name:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
  internal_controller.RegisterUserReq:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
      phone:
        type: string
      role:
        type: string
    required:
    - email
    - password
    - phone
    - role
    type: object
  internal_controller.RegisterVehicleReq:
    properties:
      brand:
        type: string
      capacity_volume_cbm:
        type: number
      capacity_weight_kg:
        type: number
      driver_id:
        type: string
      license_plate:
        type: string
      model:
        type: string
      vehicle_type:
        type: string
    required:
    - brand
    - capacity_volume_cbm
    - capacity_weight_kg
    - driver_id
    - license_plate
    - model
    - vehicle_type
    type: object
  internal_controller.SubmitAskReq:
    properties:
      driver_id:
        type: string
      min_price:
        type: number
    required:
    - driver_id
    - min_price
    type: object
  internal_controller.SubmitBidReq:
    properties:
      max_price:
        type: number
      shipper_id:
        type: string
    required:
    - max_price
    - shipper_id
    type: object
  internal_controller.UpdateDriverKYCReq:
    properties:
      kyc_status:
        type: string
    required:
    - kyc_status
    type: object
  internal_controller.UpdateVehicleStatusReq:
    properties:
      status:
        type: string
    required:
    - status
    type: object
host: localhost:8080
info:
  contact: {}
  description: |-
    API Gateway trung tâm cho hệ thống Logistics OS. Nhận toàn bộ HTTP request từ client và phân luồng tới các microservice nội bộ qua gRPC.

    **Các service được proxy:**
    - **Auth** (`/api/v1/auth/*`) — Đăng ký, đăng nhập, OAuth2 Google, xác thực token
    - **User** (`/v1/users/*`) — Quản lý người dùng, profile driver/shipper, KYC (gRPC-Gateway)
    - **Vehicle** (`/v1/vehicles/*`) — Đăng ký & quản lý phương tiện (gRPC-Gateway)
    - **Matching** (gRPC only) — Matching engine cho Bid/Ask, chưa expose HTTP
  title: Logistics OS — Gateway API
  version: "1.0"
paths:
  /api/auth/v1/get-info:
    get:
      description: Lấy thông tin profile của người dùng hiện tại. Token có thể truyền
        qua cookie access_token hoặc header Authorization Bearer.
      parameters:
      - description: Bearer token (nếu không dùng cookie)
        in: header
        name: Authorization
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Lấy thông tin thành công
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Token không hợp lệ hoặc không tìm thấy
          schema:
            additionalProperties: true
            type: object
      summary: Lấy thông tin người dùng
      tags:
      - Auth
  /api/auth/v1/google/callback:
    get:
      description: Xử lý callback từ Google sau khi user đăng nhập. Xác thực state,
        đổi code lấy token, set cookie access_token và refresh_token, rồi redirect
        về frontend.
      parameters:
      - description: OAuth state parameter (CSRF protection)
        in: query
        name: state
        required: true
        type: string
      - description: Authorization code từ Google
        in: query
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "307":
          description: Redirect về frontend với cookie đã set
          schema:
            type: string
        "400":
          description: State không hợp lệ
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Lỗi xử lý callback
          schema:
            additionalProperties: true
            type: object
      summary: Google OAuth2 Callback
      tags:
      - Auth - OAuth2
  /api/auth/v1/google/login:
    get:
      description: Khởi tạo luồng OAuth2 với Google. Redirect người dùng đến trang
        đăng nhập Google. Tạo state cookie để chống CSRF.
      produces:
      - application/json
      responses:
        "307":
          description: Redirect đến Google OAuth consent screen
          schema:
            type: string
        "500":
          description: Lỗi khi lấy Google Login URL
          schema:
            additionalProperties: true
            type: object
      summary: Đăng nhập bằng Google OAuth2
      tags:
      - Auth - OAuth2
  /api/auth/v1/login:
    post:
      consumes:
      - application/json
      description: Đăng nhập bằng email và mật khẩu. Trả về access_token, refresh_token
        và expires_in.
      parameters:
      - description: Thông tin đăng nhập
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_controller.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Đăng nhập thành công, trả về token pair
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Lỗi dữ liệu đầu vào
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Sai email hoặc mật khẩu
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Lỗi server nội bộ
          schema:
            additionalProperties: true
            type: object
      summary: Đăng nhập
      tags:
      - Auth
  /api/auth/v1/register:
    post:
      consumes:
      - application/json
      description: Tạo tài khoản mới bằng email và mật khẩu. Gateway chuyển tiếp request
        tới auth_service qua gRPC.
      parameters:
      - description: Thông tin đăng ký
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_controller.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Tạo tài khoản thành công
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Lỗi dữ liệu đầu vào
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Email đã tồn tại
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Lỗi server nội bộ
          schema:
            additionalProperties: true
            type: object
      summary: Đăng ký tài khoản
      tags:
      - Auth
  /api/matching/v1/accept:
    post:
      consumes:
      - application/json
      description: Khách hàng hoặc tài xế chấp nhận lệnh ghép chuyến.
      parameters:
      - description: Thông tin Match
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_controller.AcceptMatchReq'
      produces:
      - application/json
      responses:
        "200":
          description: Chấp nhận thành công
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Lỗi dữ liệu đầu vào
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Lỗi server nội bộ
          schema:
            additionalProperties: true
            type: object
      summary: Chấp nhận ghép chuyến
      tags:
      - Matching
  /api/matching/v1/ask:
    post:
      consumes:
      - application/json
      description: Tài xế gửi báo giá có xe trống (Ask) để ghép chuyến.
      parameters:
      - description: Thông tin Ask
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_controller.SubmitAskReq'
      produces:
      - application/json
      responses:
        "200":
          description: Gửi Ask thành công
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Lỗi dữ liệu đầu vào
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Lỗi server nội bộ
          schema:
            additionalProperties: true
            type: object
      summary: Gửi báo giá vận chuyển (Ask)
      tags:
      - Matching
  /api/matching/v1/bid:
    post:
      consumes:
      - application/json
      description: Khách hàng gửi yêu cầu vận chuyển hàng hóa kèm theo giá cước đề
        xuất (Bid).
      parameters:
      - description: Thông vị Bid
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_controller.SubmitBidReq'
      produces:
      - application/json
      responses:
        "200":
          description: Gửi Bid thành công
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Lỗi dữ liệu đầu vào
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Lỗi server nội bộ
          schema:
            additionalProperties: true
            type: object
      summary: Gửi yêu cầu vận chuyển (Bid)
      tags:
      - Matching
  /api/media/v1/delete/{publicID}:
    delete:
      description: Xóa file trên hệ thống lưu trữ thông qua public_id.
      parameters:
      - description: Public ID của file cần xóa
        in: path
        name: publicID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Xóa thành công
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Thiếu public_id
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Không tìm thấy file
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Lỗi server nội bộ
          schema:
            additionalProperties: true
            type: object
      summary: Xóa file
      tags:
      - Media
  /api/media/v1/upload:
    post:
      consumes:
      - multipart/form-data
      description: Nhận file qua multipart/form-data và gọi gRPC sang media_service
        để lưu trữ (ví dụ Cloudinary).
      parameters:
      - description: File cần tải lên
        in: formData
        name: file
        required: true
        type: file
      - description: Thư mục lưu trữ
        in: formData
        name: folder
        type: string
      - description: Tiền tố tên file
        in: formData
        name: prefix
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Tải lên thành công, trả về URL
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Lỗi thiếu file hoặc file không hợp lệ
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Lỗi server nội bộ
          schema:
            additionalProperties: true
            type: object
      summary: Tải file lên hệ thống
      tags:
      - Media
  /api/user/v1/{id}:
    get:
      description: Lấy thông tin chi tiết của người dùng bằng ID.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Thông tin chi tiết người dùng
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Thiếu ID
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Lỗi server nội bộ
          schema:
            additionalProperties: true
            type: object
      summary: Lấy thông tin User
      tags:
      - User
  /api/user/v1/{user_id}/kyc:
    put:
      consumes:
      - application/json
      description: Cập nhật trạng thái KYC.
      parameters:
      - description: User ID của tài xế
        in: path
        name: user_id
        required: true
        type: string
      - description: Thông tin KYC
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_controller.UpdateDriverKYCReq'
      produces:
      - application/json
      responses:
        "200":
          description: Cập nhật thành công
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Lỗi dữ liệu đầu vào
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Lỗi server nội bộ
          schema:
            additionalProperties: true
            type: object
      summary: Cập nhật thông tin KYC của tài xế
      tags:
      - User
  /api/user/v1/register:
    post:
      consumes:
      - application/json
      description: Đăng ký người dùng hoặc tài xế mới vào hệ thống.
      parameters:
      - description: Thông tin đăng ký
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_controller.RegisterUserReq'
      produces:
      - application/json
      responses:
        "201":
          description: Tạo người dùng thành công
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Lỗi dữ liệu đầu vào
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Lỗi server nội bộ
          schema:
            additionalProperties: true
            type: object
      summary: Đăng ký user mới
      tags:
      - User
  /api/vehicle/v1/{id}:
    get:
      description: Lấy thông tin chi tiết của một phương tiện theo ID.
      parameters:
      - description: Vehicle ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Thông tin chi tiết phương tiện
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Thiếu ID
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Lỗi server nội bộ
          schema:
            additionalProperties: true
            type: object
      summary: Lấy thông tin phương tiện
      tags:
      - Vehicle
  /api/vehicle/v1/{id}/status:
    put:
      consumes:
      - application/json
      description: Cập nhật trạng thái của phương tiện (Active, Inactive, InTransit...).
      parameters:
      - description: Vehicle ID
        in: path
        name: id
        required: true
        type: string
      - description: Trạng thái mới
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_controller.UpdateVehicleStatusReq'
      produces:
      - application/json
      responses:
        "200":
          description: Cập nhật thành công
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Lỗi dữ liệu đầu vào
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Lỗi server nội bộ
          schema:
            additionalProperties: true
            type: object
      summary: Cập nhật trạng thái
      tags:
      - Vehicle
  /api/vehicle/v1/list:
    get:
      description: Lấy danh sách các phương tiện trong hệ thống của tài xế.
      parameters:
      - description: Driver ID để lọc
        in: query
        name: driver_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Danh sách phương tiện
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Lỗi server nội bộ
          schema:
            additionalProperties: true
            type: object
      summary: Danh sách phương tiện
      tags:
      - Vehicle
  /api/vehicle/v1/register:
    post:
      consumes:
      - application/json
      description: Đăng ký thông tin phương tiện (xe tải, xe khách...) cho tài xế.
      parameters:
      - description: Thông tin phương tiện
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_controller.RegisterVehicleReq'
      produces:
      - application/json
      responses:
        "201":
          description: Tạo phương tiện thành công
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Lỗi dữ liệu đầu vào
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Lỗi server nội bộ
          schema:
            additionalProperties: true
            type: object
      summary: Đăng ký phương tiện
      tags:
      - Vehicle
swagger: "2.0"
