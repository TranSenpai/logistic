basePath: /
definitions:
  handler.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  handler.RegisterRequest:
    properties:
      email:
        type: string
      full_name:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  RegisterUserRequest:
    properties:
      phone:
        type: string
      email:
        type: string
      password:
        type: string
      role:
        type: string
        description: "driver hoặc shipper"
    required:
    - phone
    - email
    - password
    - role
    type: object
  RegisterUserResponse:
    properties:
      id:
        type: string
      message:
        type: string
    type: object
  User:
    properties:
      id:
        type: string
      phone:
        type: string
      email:
        type: string
      role:
        type: string
      status:
        type: string
      created_at:
        type: string
      updated_at:
        type: string
    type: object
  DriverProfile:
    properties:
      user_id:
        type: string
      license_number:
        type: string
      id_card:
        type: string
      rating:
        type: number
      kyc_status:
        type: string
    type: object
  ShipperProfile:
    properties:
      user_id:
        type: string
      company_name:
        type: string
      tax_code:
        type: string
    type: object
  GetUserResponse:
    properties:
      user:
        $ref: '#/definitions/User'
      driver_profile:
        $ref: '#/definitions/DriverProfile'
      shipper_profile:
        $ref: '#/definitions/ShipperProfile'
    type: object
  UpdateDriverKYCRequest:
    properties:
      user_id:
        type: string
      kyc_status:
        type: string
        description: "approved hoặc rejected"
    required:
    - kyc_status
    type: object
  RegisterVehicleRequest:
    properties:
      driver_id:
        type: string
      license_plate:
        type: string
      brand:
        type: string
      model:
        type: string
      vehicle_type:
        type: string
        description: "Truck, Van, Bike"
      capacity_weight_kg:
        type: number
      capacity_volume_cbm:
        type: number
    required:
    - driver_id
    - license_plate
    - vehicle_type
    type: object
  RegisterVehicleResponse:
    properties:
      id:
        type: string
      message:
        type: string
    type: object
  Vehicle:
    properties:
      id:
        type: string
      driver_id:
        type: string
      license_plate:
        type: string
      brand:
        type: string
      model:
        type: string
      vehicle_type:
        type: string
      capacity_weight_kg:
        type: number
      capacity_volume_cbm:
        type: number
      status:
        type: string
    type: object
  ListVehiclesResponse:
    properties:
      vehicles:
        type: array
        items:
          $ref: '#/definitions/Vehicle'
    type: object
  UpdateVehicleStatusRequest:
    properties:
      status:
        type: string
    required:
    - status
    type: object
host: localhost:8080
info:
  contact: {}
  description: |-
    API Gateway trung tâm cho hệ thống Logistics OS. Nhận toàn bộ HTTP request từ client và phân luồng tới các microservice nội bộ qua gRPC.

    **Các service được proxy:**
    - **Auth** (`/api/v1/auth/*`) — Đăng ký, đăng nhập, OAuth2 Google, xác thực token
    - **User** (`/v1/users/*`) — Quản lý người dùng, profile driver/shipper, KYC (gRPC-Gateway)
    - **Vehicle** (`/v1/vehicles/*`) — Đăng ký & quản lý phương tiện (gRPC-Gateway)
    - **Matching** (gRPC only) — Matching engine cho Bid/Ask, chưa expose HTTP
  title: Logistics OS — Gateway API
  version: "1.0"
paths:
  # ──────────────────────────────────────────────
  # AUTH SERVICE (Gin handlers — /api/v1/auth/*)
  # ──────────────────────────────────────────────
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Tạo tài khoản mới bằng email và mật khẩu. Gateway chuyển tiếp request tới auth_service qua gRPC.
      parameters:
      - description: Thông tin đăng ký
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Tạo tài khoản thành công
          schema:
            type: object
            additionalProperties: true
        "400":
          description: Lỗi dữ liệu đầu vào
          schema:
            type: object
            additionalProperties: true
        "409":
          description: Email đã tồn tại
          schema:
            type: object
            additionalProperties: true
        "500":
          description: Lỗi server nội bộ
          schema:
            type: object
            additionalProperties: true
      summary: Đăng ký tài khoản
      tags:
      - Auth

  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Đăng nhập bằng email và mật khẩu. Trả về access_token, refresh_token và expires_in.
      parameters:
      - description: Thông tin đăng nhập
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Đăng nhập thành công, trả về token pair
          schema:
            type: object
            additionalProperties: true
        "400":
          description: Lỗi dữ liệu đầu vào
          schema:
            type: object
            additionalProperties: true
        "401":
          description: Sai email hoặc mật khẩu
          schema:
            type: object
            additionalProperties: true
        "500":
          description: Lỗi server nội bộ
          schema:
            type: object
            additionalProperties: true
      summary: Đăng nhập
      tags:
      - Auth

  /api/v1/auth/get-info:
    get:
      description: Lấy thông tin profile của người dùng hiện tại. Token có thể truyền qua cookie access_token hoặc header Authorization Bearer.
      parameters:
      - description: "Bearer token (nếu không dùng cookie)"
        in: header
        name: Authorization
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Lấy thông tin thành công
          schema:
            type: object
            additionalProperties: true
        "401":
          description: Token không hợp lệ hoặc không tìm thấy
          schema:
            type: object
            additionalProperties: true
      summary: Lấy thông tin người dùng
      tags:
      - Auth

  /api/v1/auth/google/login:
    get:
      description: Khởi tạo luồng OAuth2 với Google. Redirect người dùng đến trang đăng nhập Google. Tạo state cookie để chống CSRF.
      produces:
      - application/json
      responses:
        "307":
          description: Redirect đến Google OAuth consent screen
          schema:
            type: string
        "500":
          description: Lỗi khi lấy Google Login URL
          schema:
            type: object
            additionalProperties: true
      summary: Đăng nhập bằng Google OAuth2
      tags:
      - Auth - OAuth2

  /api/v1/auth/google/callback:
    get:
      description: Xử lý callback từ Google sau khi user đăng nhập. Xác thực state, đổi code lấy token, set cookie access_token và refresh_token, rồi redirect về frontend.
      parameters:
      - description: OAuth state parameter (CSRF protection)
        in: query
        name: state
        required: true
        type: string
      - description: Authorization code từ Google
        in: query
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "307":
          description: Redirect về frontend với cookie đã set
          schema:
            type: string
        "400":
          description: State không hợp lệ
          schema:
            type: object
            additionalProperties: true
        "500":
          description: Lỗi xử lý callback
          schema:
            type: object
            additionalProperties: true
      summary: Google OAuth2 Callback
      tags:
      - Auth - OAuth2

  # ──────────────────────────────────────────────
  # USER SERVICE (gRPC-Gateway — /v1/users/*)
  # ──────────────────────────────────────────────
  /v1/users/register:
    post:
      consumes:
      - application/json
      description: Đăng ký người dùng mới với role driver hoặc shipper. Proxied qua gRPC-Gateway tới user_service.
      parameters:
      - description: Thông tin đăng ký user
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/RegisterUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Đăng ký thành công
          schema:
            $ref: '#/definitions/RegisterUserResponse'
        "400":
          description: Lỗi dữ liệu đầu vào
          schema:
            type: object
            additionalProperties: true
        "500":
          description: Lỗi server
          schema:
            type: object
            additionalProperties: true
      summary: Đăng ký người dùng (User Service)
      tags:
      - User

  /v1/users/{id}:
    get:
      description: Lấy thông tin chi tiết của user theo ID, bao gồm profile driver hoặc shipper nếu có. Proxied qua gRPC-Gateway tới user_service.
      parameters:
      - description: User ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Thông tin user chi tiết
          schema:
            $ref: '#/definitions/GetUserResponse'
        "404":
          description: User không tìm thấy
          schema:
            type: object
            additionalProperties: true
      summary: Lấy thông tin user (User Service)
      tags:
      - User

  /v1/users/{user_id}/kyc:
    put:
      consumes:
      - application/json
      description: Cập nhật trạng thái KYC cho driver (approved/rejected). Proxied qua gRPC-Gateway tới user_service.
      parameters:
      - description: User ID của driver
        in: path
        name: user_id
        required: true
        type: string
      - description: Trạng thái KYC mới
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/UpdateDriverKYCRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Cập nhật KYC thành công
          schema:
            type: object
            properties:
              message:
                type: string
        "400":
          description: Lỗi dữ liệu
          schema:
            type: object
            additionalProperties: true
      summary: Cập nhật KYC driver (User Service)
      tags:
      - User

  # ──────────────────────────────────────────────
  # VEHICLE SERVICE (gRPC-Gateway — /v1/vehicles/*)
  # ──────────────────────────────────────────────
  /v1/vehicles:
    get:
      description: Liệt kê tất cả phương tiện của một driver. Proxied qua gRPC-Gateway tới vehicle_service.
      parameters:
      - description: Driver ID để lọc phương tiện
        in: query
        name: driver_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Danh sách phương tiện
          schema:
            $ref: '#/definitions/ListVehiclesResponse'
      summary: Liệt kê phương tiện (Vehicle Service)
      tags:
      - Vehicle

    post:
      consumes:
      - application/json
      description: Đăng ký phương tiện mới cho driver. Proxied qua gRPC-Gateway tới vehicle_service.
      parameters:
      - description: Thông tin phương tiện
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/RegisterVehicleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Đăng ký phương tiện thành công
          schema:
            $ref: '#/definitions/RegisterVehicleResponse'
        "400":
          description: Lỗi dữ liệu
          schema:
            type: object
            additionalProperties: true
      summary: Đăng ký phương tiện (Vehicle Service)
      tags:
      - Vehicle

  /v1/vehicles/{id}:
    get:
      description: Lấy thông tin chi tiết của phương tiện theo ID. Proxied qua gRPC-Gateway tới vehicle_service.
      parameters:
      - description: Vehicle ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Thông tin chi tiết phương tiện
          schema:
            $ref: '#/definitions/Vehicle'
        "404":
          description: Phương tiện không tìm thấy
          schema:
            type: object
            additionalProperties: true
      summary: Lấy thông tin phương tiện (Vehicle Service)
      tags:
      - Vehicle

  /v1/vehicles/{id}/status:
    put:
      consumes:
      - application/json
      description: Cập nhật trạng thái phương tiện (active/inactive/maintenance). Proxied qua gRPC-Gateway tới vehicle_service.
      parameters:
      - description: Vehicle ID
        in: path
        name: id
        required: true
        type: string
      - description: Trạng thái mới
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/UpdateVehicleStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Cập nhật trạng thái thành công
          schema:
            type: object
            properties:
              message:
                type: string
        "400":
          description: Lỗi dữ liệu
          schema:
            type: object
            additionalProperties: true
      summary: Cập nhật trạng thái phương tiện (Vehicle Service)
      tags:
      - Vehicle
swagger: "2.0"
