networks:
  logistic_net:
    driver: bridge

services:
  gateway-service:
    build:
      context: ./gateway_service
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - gateway-data:/app/data
    networks:
      - logistic_net

  auth-service:
    build:
      context: ./auth_service
      dockerfile: Dockerfile
    ports: 
      - "9001:9001"
    env_file:
      - .env
    volumes:
      - auth-data:/app/data
    networks:
      - logistic_net
  
  media-service:
    build:
      context: ./media_service
      dockerfile: Dockerfile
    ports:
      - "9002:9002"
    env_file:
      - .env
    volumes:
      - media-data:/app/data
    networks:
      - logistic_net

  matching-service:
    build:
      context: ./matching_service
      dockerfile: Dockerfile
    ports:
      - "9003:9003"
    env_file:
      - .env
    volumes:
      - matching-data:/app/data
    networks:
      - logistic_net

  user-service:
    build:
      context: ./user_service
      dockerfile: Dockerfile
    ports:
      - "9004:9004"
    env_file:
      - .env
    volumes:
      - user-data:/app/data
    networks:
      - logistic_net

  vehicle-service:
    build:
      context: ./vehicle_service
      dockerfile: Dockerfile
    ports:
      - "9005:9005"
    env_file:
      - .env
    volumes:
      - vehicle-data:/app/data
    networks:
      - logistic_net

  matching-db-master:
    image: docker.io/library/postgres:16-alpine
    container_name: matching-db-master
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${MATCHING_DB_USER}
      POSTGRES_PASSWORD: ${MATCHING_DB_PASSWORD}
      POSTGRES_DB: ${MATCHING_DB_NAME}
      REPLICATION_USER: ${MATCHING_DB_REPLICATION_USER}
      REPLICATION_PASSWORD: ${MATCHING_DB_REPLICATION_PASSWORD}
    command: 
      - "postgres"
      - "-c" # Config file
      - "config_file=/etc/postgresql/postgresql.conf"
    volumes:
      - matching-db-master-data:/var/lib/postgresql/data
      - ./config/matching_conf/postgresql.conf:/etc/postgresql/postgresql.conf
      # Thư mục /docker-entrypoint-initdb.d/ là điểm neo (hook) khởi tạo của Image PostgreSQL.
      # Bất kỳ script (.sh, .sql) nào được mount vào đây sẽ tự động được thực thi 1 lần 
      # duy nhất trong giai đoạn bootstrap (khi thư mục data còn trống).
      # Script register-replica.sh được dùng để cấp phát User Replication và cập nhật pg_hba.conf trước khi DB mở port kết nối.
      - ./scripts/matching_service/db/register-replica.sh:/docker-entrypoint-initdb.d/register-replica.sh
    networks:
      - logistic_net

  matching-db-slave:
    image: docker.io/library/postgres:16-alpine
    container_name: matching-db-slave
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${MATCHING_DB_USER}
      POSTGRES_PASSWORD: ${MATCHING_DB_PASSWORD}
      PGPASSWORD: ${MATCHING_DB_REPLICATION_PASSWORD}
    depends_on:
      - matching-db-master
    volumes:
      - postgres-replica-data:/var/lib/postgresql/data
      - ./scripts/matching_service/db/start-replica.sh:/scripts/matching_service/db/start-replica.sh
    command:
      - "bash"
      - "/scripts/matching_service/db/start-replica.sh"
    networks:
      - logistic_net

  nats:
    image: docker.io/library/nats:2.10-alpine
    container_name: nats-server
    command: 
      - "-js"           # Kích hoạt chế độ JetStream
      - "-sd"           # Cờ chỉ định Store Directory
      - "/data"         # Thư mục lưu trữ JetStream data
      - "-m"            # Cờ -m <port> (viết tắt của --http_port): Dùng để ra lệnh cho NATS mở một cổng HTTP để bạn có thể xem các thông số Monitor (Giám sát).
      - "8222"          # Kích hoạt cổng Monitor Web
    ports:
      - "4222:4222"     # Port giao tiếp của Client
      - "8222:8222"     # Port giao tiếp HTTP Monitor
    volumes:
      - nats-data:/data # Ánh xạ Volume vào đúng thư mục đã chỉ định
    networks:
      - logistic_net

  controller-1:
    image: docker.io/apache/kafka:4.3.1
    container_name: controller-1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000
      KAFKA_KRAFT_CLUSTER_ID: ${KAFKA_KRAFT_CLUSTER_ID}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - controller-1-data:/var/lib/kafka/data
    networks:
      - logistic_net

  controller-2:
    image: docker.io/apache/kafka:4.3.1
    container_name: controller-2
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000
      KAFKA_KRAFT_CLUSTER_ID: ${KAFKA_KRAFT_CLUSTER_ID}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - controller-2-data:/var/lib/kafka/data
    networks:
      - logistic_net

  controller-3:
    image: docker.io/apache/kafka:4.3.1
    container_name: controller-3
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000
      KAFKA_KRAFT_CLUSTER_ID: ${KAFKA_KRAFT_CLUSTER_ID}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - controller-3-data:/var/lib/kafka/data
    networks:
      - logistic_net

  broker-1:
    image: docker.io/apache/kafka:4.3.1
    container_name: broker-1
    ports:
      - 29092:9092
    environment:
      KAFKA_NODE_ID: 4
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: 'PLAINTEXT://:19092,PLAINTEXT_HOST://:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker-1:19092,PLAINTEXT_HOST://localhost:29092'
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000
      KAFKA_KRAFT_CLUSTER_ID: ${KAFKA_KRAFT_CLUSTER_ID}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    depends_on:
      - controller-1
      - controller-2
      - controller-3
    volumes:
      - broker-1-data:/var/lib/kafka/data
    networks:
      - logistic_net

  broker-2:
    image: docker.io/apache/kafka:4.3.1
    container_name: broker-2
    ports:
      - 39092:9092
    environment:
      KAFKA_NODE_ID: 5
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: 'PLAINTEXT://:19092,PLAINTEXT_HOST://:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker-2:19092,PLAINTEXT_HOST://localhost:39092'
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000
      KAFKA_KRAFT_CLUSTER_ID: ${KAFKA_KRAFT_CLUSTER_ID}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    depends_on:
      - controller-1
      - controller-2
      - controller-3
    volumes:
      - broker-2-data:/var/lib/kafka/data
    networks:
      - logistic_net

  broker-3:
    image: docker.io/apache/kafka:4.3.1
    container_name: broker-3
    ports:
      - 49092:9092
    environment:
      KAFKA_NODE_ID: 6
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: 'PLAINTEXT://:19092,PLAINTEXT_HOST://:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker-3:19092,PLAINTEXT_HOST://localhost:49092'
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000
      KAFKA_KRAFT_CLUSTER_ID: ${KAFKA_KRAFT_CLUSTER_ID}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    depends_on:
      - controller-1
      - controller-2
      - controller-3
    volumes:
      - broker-3-data:/var/lib/kafka/data
    networks:
      - logistic_net

  kafka-ui:
    image: docker.io/provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports: 
      - "8081:8081"
    environment:
      KAFKA_CLUSTERS_0_NAME: "Logistic-Cluster"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "broker-1:19092,broker-2:19092,broker-3:19092"
    depends_on:
      - broker-1
      - broker-2
      - broker-3
    networks:
      - logistic_net

  auth-db-master:
    image: docker.io/library/mysql:8.0
    container_name: auth-db-master
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${AUTH_SERVICE_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${AUTH_SERVICE_DB_NAME}
      MYSQL_USER: ${AUTH_SERVICE_DB_USER}
      MYSQL_PASSWORD: ${AUTH_SERVICE_DB_PASSWORD}
      REPLICATION_USER: ${AUTH_DB_REPLICATION_USER}
      REPLICATION_PASSWORD: ${AUTH_DB_REPLICATION_PASSWORD}
    volumes:
      - auth-db-master-data:/var/lib/mysql
      - ./config/auth_conf/master.cnf:/etc/mysql/conf.d/master.cnf
      - ./scripts/auth_service/db/init-master.sql:/docker-entrypoint-initdb.d/init-master.sql
    networks:
      - logistic_net

  auth-db-slave:
    image: docker.io/library/mysql:8.0
    container_name: auth-db-slave
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${AUTH_SERVICE_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${AUTH_SERVICE_DB_NAME}
      MYSQL_USER: ${AUTH_SERVICE_DB_USER}
      MYSQL_PASSWORD: ${AUTH_SERVICE_DB_PASSWORD}
      REPLICATION_USER: ${AUTH_DB_REPLICATION_USER}
      REPLICATION_PASSWORD: ${AUTH_DB_REPLICATION_PASSWORD}
      MASTER_HOST: auth-db-master
    depends_on:
      - auth-db-master
    volumes:
      - auth-db-slave-data:/var/lib/mysql
      - ./config/auth_conf/slave.cnf:/etc/mysql/conf.d/slave.cnf
      - ./scripts/auth_service/db/start-replica.sh:/docker-entrypoint-initdb.d/start-replica.sh
    networks:
      - logistic_net

  user-db-master:
    image: docker.io/library/postgres:16-alpine
    container_name: user-db-master
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: ${USER_DB_USER}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
      POSTGRES_DB: ${USER_DB_NAME}
      REPLICATION_USER: ${USER_DB_REPLICATION_USER}
      REPLICATION_PASSWORD: ${USER_DB_REPLICATION_PASSWORD}
    command: 
      - "postgres"
      - "-c"
      - "config_file=/etc/postgresql/postgresql.conf"
    volumes:
      - user-db-master-data:/var/lib/postgresql/data
      - ./config/user_conf/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./scripts/user_service/db/register-replica.sh:/docker-entrypoint-initdb.d/register-replica.sh
    networks:
      - logistic_net

  user-db-slave:
    image: docker.io/library/postgres:16-alpine
    container_name: user-db-slave
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: ${USER_DB_USER}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
      PGPASSWORD: ${USER_DB_REPLICATION_PASSWORD}
    depends_on:
      - user-db-master
    volumes:
      - user-db-slave-data:/var/lib/postgresql/data
      - ./scripts/user_service/db/start-replica.sh:/scripts/user_service/db/start-replica.sh
    command:
      - "bash"
      - "/scripts/user_service/db/start-replica.sh"
    networks:
      - logistic_net

  vehicle-db-master:
    image: docker.io/library/postgres:16-alpine
    container_name: vehicle-db-master
    ports:
      - "5436:5432"
    environment:
      POSTGRES_USER: ${VEHICLE_DB_USER}
      POSTGRES_PASSWORD: ${VEHICLE_DB_PASSWORD}
      POSTGRES_DB: ${VEHICLE_DB_NAME}
      REPLICATION_USER: ${VEHICLE_DB_REPLICATION_USER}
      REPLICATION_PASSWORD: ${VEHICLE_DB_REPLICATION_PASSWORD}
    command: 
      - "postgres"
      - "-c"
      - "config_file=/etc/postgresql/postgresql.conf"
    volumes:
      - vehicle-db-master-data:/var/lib/postgresql/data
      - ./config/vehicle_conf/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./scripts/vehicle_service/db/register-replica.sh:/docker-entrypoint-initdb.d/register-replica.sh
    networks:
      - logistic_net

  vehicle-db-slave:
    image: docker.io/library/postgres:16-alpine
    container_name: vehicle-db-slave
    ports:
      - "5437:5432"
    environment:
      POSTGRES_USER: ${VEHICLE_DB_USER}
      POSTGRES_PASSWORD: ${VEHICLE_DB_PASSWORD}
      PGPASSWORD: ${VEHICLE_DB_REPLICATION_PASSWORD}
    depends_on:
      - vehicle-db-master
    volumes:
      - vehicle-db-slave-data:/var/lib/postgresql/data
      - ./scripts/vehicle_service/db/start-replica.sh:/scripts/vehicle_service/db/start-replica.sh
    command:
      - "bash"
      - "/scripts/vehicle_service/db/start-replica.sh"
    networks:
      - logistic_net

volumes:
  nats-data:
  gateway-data:
  auth-data:
  media-data:
  matching-data:
  user-data:
  vehicle-data:
  matching-db-master-data:
  postgres-replica-data:
  controller-1-data:
  controller-2-data:
  controller-3-data:
  broker-1-data:
  broker-2-data:
  broker-3-data:
  auth-db-master-data:
  auth-db-slave-data:
  user-db-master-data:
  user-db-slave-data:
  vehicle-db-master-data:
  vehicle-db-slave-data: