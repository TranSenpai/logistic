networks:
  logistic_net:
    driver: bridge

services:
  gateway-service:
    build:
      # Context = gốc repo, để Docker nhìn thấy được api/ và pkg/
      # (go.mod của service có replace => ../api, ../pkg)
      context: .
      dockerfile: gateway_service/Dockerfile
    # Image do GitHub Actions build sẵn và đẩy lên GHCR. EC2 chỉ pull, không compile.
    # IMAGE_TAG được CI ghi vào .env (= git sha) => pin đúng phiên bản, dễ rollback.
    image: ghcr.io/transenpai/logistic/gateway-service:${IMAGE_TAG:-latest}
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - gateway-data:/app/data
    networks:
      - logistic_net

  auth-service:
    build:
      # Context = gốc repo, để Docker nhìn thấy được api/ và pkg/
      # (go.mod của service có replace => ../api, ../pkg)
      context: .
      dockerfile: auth_service/Dockerfile
    # Image do GitHub Actions build sẵn và đẩy lên GHCR. EC2 chỉ pull, không compile.
    # IMAGE_TAG được CI ghi vào .env (= git sha) => pin đúng phiên bản, dễ rollback.
    image: ghcr.io/transenpai/logistic/auth-service:${IMAGE_TAG:-latest}
    ports: 
      - "9001:9001"
    env_file:
      - .env
    volumes:
      - auth-data:/app/data
    networks:
      - logistic_net
  
  media-service:
    build:
      # Context = gốc repo, để Docker nhìn thấy được api/ và pkg/
      # (go.mod của service có replace => ../api, ../pkg)
      context: .
      dockerfile: media_service/Dockerfile
    # Image do GitHub Actions build sẵn và đẩy lên GHCR. EC2 chỉ pull, không compile.
    # IMAGE_TAG được CI ghi vào .env (= git sha) => pin đúng phiên bản, dễ rollback.
    image: ghcr.io/transenpai/logistic/media-service:${IMAGE_TAG:-latest}
    ports:
      - "9002:9002"
    env_file:
      - .env
    volumes:
      - media-data:/app/data
    networks:
      - logistic_net

  matching-service:
    build:
      # Context = gốc repo, để Docker nhìn thấy được api/ và pkg/
      # (go.mod của service có replace => ../api, ../pkg)
      context: .
      dockerfile: matching_service/Dockerfile
    # Image do GitHub Actions build sẵn và đẩy lên GHCR. EC2 chỉ pull, không compile.
    # IMAGE_TAG được CI ghi vào .env (= git sha) => pin đúng phiên bản, dễ rollback.
    image: ghcr.io/transenpai/logistic/matching-service:${IMAGE_TAG:-latest}
    ports:
      - "9003:9003"
    env_file:
      - .env
    volumes:
      - matching-data:/app/data
    networks:
      - logistic_net

  user-service:
    build:
      # Context = gốc repo, để Docker nhìn thấy được api/ và pkg/
      # (go.mod của service có replace => ../api, ../pkg)
      context: .
      dockerfile: user_service/Dockerfile
    # Image do GitHub Actions build sẵn và đẩy lên GHCR. EC2 chỉ pull, không compile.
    # IMAGE_TAG được CI ghi vào .env (= git sha) => pin đúng phiên bản, dễ rollback.
    image: ghcr.io/transenpai/logistic/user-service:${IMAGE_TAG:-latest}
    ports:
      - "9004:9004"
    env_file:
      - .env
    volumes:
      - user-data:/app/data
    networks:
      - logistic_net

  vehicle-service:
    build:
      # Context = gốc repo, để Docker nhìn thấy được api/ và pkg/
      # (go.mod của service có replace => ../api, ../pkg)
      context: .
      dockerfile: vehicle_service/Dockerfile
    # Image do GitHub Actions build sẵn và đẩy lên GHCR. EC2 chỉ pull, không compile.
    # IMAGE_TAG được CI ghi vào .env (= git sha) => pin đúng phiên bản, dễ rollback.
    image: ghcr.io/transenpai/logistic/vehicle-service:${IMAGE_TAG:-latest}
    ports:
      - "9005:9005"
    env_file:
      - .env
    volumes:
      - vehicle-data:/app/data
    networks:
      - logistic_net


  notification-service:
    build:
      # Context = gốc repo, để Docker nhìn thấy được api/ và pkg/
      context: .
      dockerfile: notification_service/Dockerfile
    image: ghcr.io/transenpai/logistic/notification-service:${IMAGE_TAG:-latest}
    ports:
      - "9006:9006"
    env_file:
      - .env
    # Consumer chỉ bind được queue khi RabbitMQ đã sẵn sàng. Không có
    # depends_on healthy thì lần khởi động đầu tiên gần như chắc chắn trượt và
    # phải chờ vòng reconnect.
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      notification-db:
        condition: service_started
    volumes:
      - notification-data:/app/data
    networks:
      - logistic_net

  # ==========================================================================
  # REDIS — cache đọc + CHỈ MỤC GEO cho "tìm xe đang chạy"
  # ==========================================================================
  # Ba service dùng chung một instance nhưng TÁCH database index và key prefix:
  #   db 0 = user_service     (cache hồ sơ, địa chỉ, thiết bị)
  #   db 1 = vehicle_service  (cache xe + sorted set GEO của xe đang online)
  #   db 2 = notification_service (bộ đếm thông báo chưa đọc)
  #
  # appendonly yes: chỉ mục GEO dựng lại từ Postgres được, nhưng AOF giúp sau
  # khi restart không có khoảng trống mà mọi xe đều "biến mất" khỏi kết quả tìm.
  redis:
    image: docker.io/library/redis:7.4-alpine
    container_name: redis
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--maxmemory"
      - "512mb"
      # allkeys-lru: khi đầy thì loại key ít dùng nhất. An toàn vì Redis ở đây
      # KHÔNG phải nguồn sự thật — mọi thứ đều dựng lại được từ Postgres.
      - "--maxmemory-policy"
      - "allkeys-lru"
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - logistic_net

  # ==========================================================================
  # RABBITMQ — hàng đợi thông báo matching_service -> notification_service
  # ==========================================================================
  # Topology (exchange, queue, binding, DLQ) được code tự khai báo lúc khởi động
  # (xem pkg/mq/rabbitmq.go DeclareTopology), nên ở đây không cần definitions.json.
  # Giao diện quản trị: http://localhost:15672
  rabbitmq:
    image: docker.io/library/rabbitmq:4-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - logistic_net

  # ==========================================================================
  # NOTIFICATION DB
  # ==========================================================================
  # Chỉ một node: bảng notifications ghi nhiều đọc ít, và dữ liệu không mang
  # tính giao dịch tiền bạc như matching/wallet nên chưa cần replica.
  notification-db:
    image: docker.io/library/postgres:16-alpine
    container_name: notification-db
    ports:
      - "5438:5432"
    environment:
      POSTGRES_USER: ${NOTIFICATION_DB_USER}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      POSTGRES_DB: ${NOTIFICATION_DB_NAME}
    volumes:
      - notification-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NOTIFICATION_DB_USER} -d ${NOTIFICATION_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - logistic_net

  matching-db-master:
    image: docker.io/library/postgres:16-alpine
    container_name: matching-db-master
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${MATCHING_DB_USER}
      POSTGRES_PASSWORD: ${MATCHING_DB_PASSWORD}
      POSTGRES_DB: ${MATCHING_DB_NAME}
      REPLICATION_USER: ${MATCHING_DB_REPLICATION_USER}
      REPLICATION_PASSWORD: ${MATCHING_DB_REPLICATION_PASSWORD}
    command: 
      - "postgres"
      - "-c" # Config file
      - "config_file=/etc/postgresql/postgresql.conf"
    volumes:
      - matching-db-master-data:/var/lib/postgresql/data
      - ./config/matching_conf/postgresql.conf:/etc/postgresql/postgresql.conf
      # Thư mục /docker-entrypoint-initdb.d/ là điểm neo (hook) khởi tạo của Image PostgreSQL.
      # Bất kỳ script (.sh, .sql) nào được mount vào đây sẽ tự động được thực thi 1 lần 
      # duy nhất trong giai đoạn bootstrap (khi thư mục data còn trống).
      # Script register-replica.sh được dùng để cấp phát User Replication và cập nhật pg_hba.conf trước khi DB mở port kết nối.
      - ./scripts/matching_service/db/register-replica.sh:/docker-entrypoint-initdb.d/register-replica.sh
    networks:
      - logistic_net

  matching-db-slave:
    image: docker.io/library/postgres:16-alpine
    container_name: matching-db-slave
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${MATCHING_DB_USER}
      POSTGRES_PASSWORD: ${MATCHING_DB_PASSWORD}
      PGPASSWORD: ${MATCHING_DB_REPLICATION_PASSWORD}
    depends_on:
      - matching-db-master
    volumes:
      - postgres-replica-data:/var/lib/postgresql/data
      - ./scripts/matching_service/db/start-replica.sh:/scripts/matching_service/db/start-replica.sh
    command:
      - "bash"
      - "/scripts/matching_service/db/start-replica.sh"
    networks:
      - logistic_net

  nats:
    image: docker.io/library/nats:2.10-alpine
    container_name: nats-server
    command: 
      - "-js"           # Kích hoạt chế độ JetStream
      - "-sd"           # Cờ chỉ định Store Directory
      - "/data"         # Thư mục lưu trữ JetStream data
      - "-m"            # Cờ -m <port> (viết tắt của --http_port): Dùng để ra lệnh cho NATS mở một cổng HTTP để bạn có thể xem các thông số Monitor (Giám sát).
      - "8222"          # Kích hoạt cổng Monitor Web
    ports:
      - "4222:4222"     # Port giao tiếp của Client
      - "8222:8222"     # Port giao tiếp HTTP Monitor
    volumes:
      - nats-data:/data # Ánh xạ Volume vào đúng thư mục đã chỉ định
    networks:
      - logistic_net

  controller-1:
    image: docker.io/apache/kafka:4.3.1
    container_name: controller-1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000
      KAFKA_KRAFT_CLUSTER_ID: ${KAFKA_KRAFT_CLUSTER_ID}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - controller-1-data:/var/lib/kafka/data
    networks:
      - logistic_net

  controller-2:
    image: docker.io/apache/kafka:4.3.1
    container_name: controller-2
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000
      KAFKA_KRAFT_CLUSTER_ID: ${KAFKA_KRAFT_CLUSTER_ID}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - controller-2-data:/var/lib/kafka/data
    networks:
      - logistic_net

  controller-3:
    image: docker.io/apache/kafka:4.3.1
    container_name: controller-3
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000
      KAFKA_KRAFT_CLUSTER_ID: ${KAFKA_KRAFT_CLUSTER_ID}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - controller-3-data:/var/lib/kafka/data
    networks:
      - logistic_net

  broker-1:
    image: docker.io/apache/kafka:4.3.1
    container_name: broker-1
    ports:
      - 29092:9092
    environment:
      KAFKA_NODE_ID: 4
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: 'PLAINTEXT://:19092,PLAINTEXT_HOST://:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker-1:19092,PLAINTEXT_HOST://localhost:29092'
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000
      KAFKA_KRAFT_CLUSTER_ID: ${KAFKA_KRAFT_CLUSTER_ID}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    depends_on:
      - controller-1
      - controller-2
      - controller-3
    volumes:
      - broker-1-data:/var/lib/kafka/data
    networks:
      - logistic_net

  broker-2:
    image: docker.io/apache/kafka:4.3.1
    container_name: broker-2
    ports:
      - 39092:9092
    environment:
      KAFKA_NODE_ID: 5
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: 'PLAINTEXT://:19092,PLAINTEXT_HOST://:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker-2:19092,PLAINTEXT_HOST://localhost:39092'
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000
      KAFKA_KRAFT_CLUSTER_ID: ${KAFKA_KRAFT_CLUSTER_ID}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    depends_on:
      - controller-1
      - controller-2
      - controller-3
    volumes:
      - broker-2-data:/var/lib/kafka/data
    networks:
      - logistic_net

  broker-3:
    image: docker.io/apache/kafka:4.3.1
    container_name: broker-3
    ports:
      - 49092:9092
    environment:
      KAFKA_NODE_ID: 6
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: 'PLAINTEXT://:19092,PLAINTEXT_HOST://:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker-3:19092,PLAINTEXT_HOST://localhost:49092'
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000
      KAFKA_KRAFT_CLUSTER_ID: ${KAFKA_KRAFT_CLUSTER_ID}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    depends_on:
      - controller-1
      - controller-2
      - controller-3
    volumes:
      - broker-3-data:/var/lib/kafka/data
    networks:
      - logistic_net

  kafka-ui:
    image: docker.io/provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "Logistic-Cluster"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "broker-1:19092,broker-2:19092,broker-3:19092"
    depends_on:
      - broker-1
      - broker-2
      - broker-3
    networks:
      - logistic_net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0
    container_name: elasticsearch
    environment:
      - node.name=es01
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - xpack.security.enabled=true
      # Tắt TLS nội bộ (chỉ dùng basic auth) để khớp với client wallet_service đang
      # dùng địa chỉ http://, và để dev/local không phải tự dựng CA certificate.
      - xpack.security.http.ssl.enabled=false
      - xpack.license.self_generated.type=basic
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:$${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - logistic_net

  # Container chạy 1 lần rồi thoát: chờ Elasticsearch khỏe, tự động gán mật khẩu
  # KIBANA_PASSWORD cho user hệ thống có sẵn "kibana_system" thông qua Security API.
  # Nhờ đó không ai phải tay copy mật khẩu từ log ES sang cấu hình Kibana.
  es-setup-kibana-user:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0
    container_name: es-setup-kibana-user
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - KIBANA_PASSWORD=${KIBANA_PASSWORD}
    # LƯU Ý: toàn bộ lệnh phải nằm trên 1 dòng YAML duy nhất. Với block scalar
    # gấp nếp (`>`), dòng nào thụt lề sâu hơn dòng gốc sẽ KHÔNG bị gộp thành
    # khoảng trắng — YAML giữ nguyên xuống dòng thật, khiến bash coi mỗi dòng
    # là 1 lệnh riêng (đây chính là bug gây lỗi "-H: command not found" trước đó).
    command: >
      bash -c "curl -sf -u elastic:$$ELASTIC_PASSWORD -X POST -H 'Content-Type: application/json' http://elasticsearch:9200/_security/user/kibana_system/_password -d '{\"password\":\"'\"$$KIBANA_PASSWORD\"'\"}' && echo '[es-setup-kibana-user] kibana_system password configured'"
    networks:
      - logistic_net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.0
    container_name: kibana
    depends_on:
      es-setup-kibana-user:
        condition: service_completed_successfully
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}
    ports:
      - "5601:5601"
    networks:
      - logistic_net

  auth-db-master:
    image: docker.io/library/mysql:8.0
    container_name: auth-db-master
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${AUTH_SERVICE_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${AUTH_SERVICE_DB_NAME}
      MYSQL_USER: ${AUTH_SERVICE_DB_USER}
      MYSQL_PASSWORD: ${AUTH_SERVICE_DB_PASSWORD}
      REPLICATION_USER: ${AUTH_DB_REPLICATION_USER}
      REPLICATION_PASSWORD: ${AUTH_DB_REPLICATION_PASSWORD}
    volumes:
      - auth-db-master-data:/var/lib/mysql
      - ./config/auth_conf/master.cnf:/etc/mysql/conf.d/master.cnf
      - ./scripts/auth_service/db/init-master.sql:/docker-entrypoint-initdb.d/init-master.sql
    networks:
      - logistic_net

  auth-db-slave:
    image: docker.io/library/mysql:8.0
    container_name: auth-db-slave
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${AUTH_SERVICE_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${AUTH_SERVICE_DB_NAME}
      MYSQL_USER: ${AUTH_SERVICE_DB_USER}
      MYSQL_PASSWORD: ${AUTH_SERVICE_DB_PASSWORD}
      REPLICATION_USER: ${AUTH_DB_REPLICATION_USER}
      REPLICATION_PASSWORD: ${AUTH_DB_REPLICATION_PASSWORD}
      MASTER_HOST: auth-db-master
    depends_on:
      - auth-db-master
    volumes:
      - auth-db-slave-data:/var/lib/mysql
      - ./config/auth_conf/slave.cnf:/etc/mysql/conf.d/slave.cnf
      - ./scripts/auth_service/db/start-replica.sh:/docker-entrypoint-initdb.d/start-replica.sh
    networks:
      - logistic_net

  user-db-master:
    image: docker.io/library/postgres:16-alpine
    container_name: user-db-master
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: ${USER_DB_USER}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
