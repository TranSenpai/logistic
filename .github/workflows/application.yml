name: 'Application Pipeline Job'

# Định nghĩa các sự kiện (triggers) sẽ kích hoạt luồng CI/CD này
on:
  push:
    branches: [ "main" ]
    # BỎ QUA không chạy luồng này nếu chỉ sửa đổi các file hạ tầng hoặc tài liệu
    paths-ignore:
      - 'terraform/**'
      - 'README.md'
      - 'docs/**'

# Ngăn chặn đụng độ (Race Condition) nếu có nhiều người push code cùng lúc
# Các luồng deploy app sẽ xếp hàng chạy lần lượt (cancel-in-progress: false)
concurrency:
  group: deploy-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-app:
    name: 'Deploy Application'
    # Github cấp phát một máy ảo Ubuntu chạy 1 lần rồi hủy
    runs-on: ubuntu-latest
    steps:
    # -------------------------------------------------------------
    # BƯỚC 1: Kéo mã nguồn từ Github về máy ảo Ubuntu này
    # -------------------------------------------------------------
    - name: Checkout Source Code
      uses: actions/checkout@v3

    # -------------------------------------------------------------
    # BƯỚC 2: "Nội soi" xem Dev vừa sửa code ở thư mục nào
    # Tool 'dorny/paths-filter' trả về kết quả True/False cho từng mục
    # -------------------------------------------------------------
    - name: Check Changed Files
      uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          auth:
            - 'auth_service/**'
          gateway:
            - 'gateway_service/**'
          matching:
            - 'matching_service/**'
          media:
            - 'media_service/**'
          user:
            - 'user_service/**'
          vehicle:
            - 'vehicle_service/**'
          # Các file cấu hình dùng chung hoặc code thư viện (pkg, api)
          shared:
            - 'pkg/**'
            - 'api/**'
            - 'docker-compose.yml'
            - '.env.example'
            - '.github/workflows/application.yml'

    # -------------------------------------------------------------
    # BƯỚC 3: Đăng nhập AWS và Lấy IP của máy chủ EC2 đang chạy
    # Mặc dù đây là luồng App, nhưng ta vẫn dùng Terraform để linh động (dynamic)
    # lấy IP mới nhất trên S3 State, giúp pipeline không bao giờ bị hardcode IP.
    # -------------------------------------------------------------
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-southeast-1

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_wrapper: false

    - name: Terraform Init
      working-directory: ./terraform/compute
      run: terraform init

    - name: Get EC2 IP Address & Security Group ID
      id: get_ip
      working-directory: ./terraform/compute
      run: |
        # Đọc IP và ID của Security Group từ AWS và lưu vào biến môi trường Github
        IP=$(terraform output -raw server_logistic_ip)
        echo "EC2_IP=$IP" >> $GITHUB_ENV
        SG_ID=$(aws ec2 describe-security-groups --filters Name=group-name,Values=logistic-security-group --query 'SecurityGroups[0].GroupId' --output text)
        echo "SG_ID=$SG_ID" >> $GITHUB_ENV

    # -------------------------------------------------------------
    # BƯỚC 4: Mở cổng Firewall (Cổng 22 - SSH) tạm thời cho Github Runner
    # -------------------------------------------------------------
    - name: Get GitHub Runner IP
      id: ip
      uses: haythem/public-ip@v1.3

    - name: Allow Runner IP to Security Group
      run: |
        aws ec2 authorize-security-group-ingress \
          --group-id ${{ env.SG_ID }} \
          --protocol tcp \
          --port 22 \
          --cidr ${{ steps.ip.outputs.ipv4 }}/32

    # Tạo thư mục gốc trên EC2 trước để lát SCP copy vào không bị lỗi
    - name: Create working directory on EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ env.EC2_IP }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        script: |
          mkdir -p /home/ubuntu/logistic

    # -------------------------------------------------------------
    # BƯỚC 5: Biến máy ảo Github thành "Thợ xây" (Builder)
    # Tải môi trường Go và đóng gói 6 microservices thành file chạy Linux (Binary)
    # -------------------------------------------------------------
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '>=1.22.0'

    - name: Compile Go Binaries
      working-directory: ${{ github.workspace }}
      run: |
        # Đảm bảo ép kiểu build cho Linux (vì EC2 chạy Linux), tắt CGO để file độc lập
        export GOOS=linux
        export GOARCH=amd64
        export CGO_ENABLED=0
        go work sync
        # Build 6 dịch vụ
        go build -o auth_service/auth_service_bin ./auth_service/cmd
        go build -o gateway_service/gateway_service_bin ./gateway_service/cmd
        go build -o matching_service/matching_service_bin ./matching_service/cmd
        go build -o media_service/media_service_bin ./media_service/cmd
        go build -o user_service/user_service_bin ./user_service/cmd
        go build -o vehicle_service/vehicle_service_bin ./vehicle_service/cmd

    # -------------------------------------------------------------
    # BƯỚC 6: Truyền file siêu tốc (SCP) sang EC2
    # Chỉ truyền những file cần thiết để chạy. Bỏ rơi hoàn toàn các thư mục
    # như api/, pkg/, nhằm giảm băng thông và bảo mật mã nguồn.
    # -------------------------------------------------------------
    - name: Copy Source Code to EC2 via SCP
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ env.EC2_IP }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        source: "auth_service/,config/,gateway_service/,matching_service/,media_service/,nginx/,scripts/,user_service/,vehicle_service/,docker-compose.yml"
        target: "/home/ubuntu/logistic"

    # -------------------------------------------------------------
    # BƯỚC 7: Kịch bản Deploy Thông Minh (Smart Restart)
    # Quyết định xem service nào cần restart dựa vào Bước 2 (Nội soi)
    # -------------------------------------------------------------
    - name: Set Services To Restart
      id: set_services
      run: |
        SERVICES=""
        # Nếu có sửa thư mục dùng chung (shared), ép buộc Restart TẤT CẢ
        if [[ "${{ steps.filter.outputs.shared }}" == 'true' ]]; then
          SERVICES="auth-service gateway-service matching-service media-service user-service vehicle-service"
        else
          # Trái lại, soi từng nhánh, nhánh nào đổi thì nối tên nhánh đó vào chuỗi
          if [[ "${{ steps.filter.outputs.auth }}" == 'true' ]]; then SERVICES="$SERVICES auth-service"; fi
          if [[ "${{ steps.filter.outputs.gateway }}" == 'true' ]]; then SERVICES="$SERVICES gateway-service"; fi
          if [[ "${{ steps.filter.outputs.matching }}" == 'true' ]]; then SERVICES="$SERVICES matching-service"; fi
          if [[ "${{ steps.filter.outputs.media }}" == 'true' ]]; then SERVICES="$SERVICES media-service"; fi
          if [[ "${{ steps.filter.outputs.user }}" == 'true' ]]; then SERVICES="$SERVICES user-service"; fi
          if [[ "${{ steps.filter.outputs.vehicle }}" == 'true' ]]; then SERVICES="$SERVICES vehicle-service"; fi
        fi
        # Lưu danh sách chốt cuối cùng vào biến môi trường
        echo "SERVICES_TO_RESTART=$SERVICES" >> $GITHUB_ENV

    # -------------------------------------------------------------
    # BƯỚC 8: Kết nối SSH vào EC2 và thực thi Docker
    # -------------------------------------------------------------
    - name: Generate .env & Deploy Podman
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ env.EC2_IP }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        envs: SERVICES_TO_RESTART
        script: |
          cd /home/ubuntu/logistic
          
          echo "Waiting for podman to be fully installed..."
          while ! command -v podman &> /dev/null; do sleep 5; done
          
          # [Tạo file .env từ Github Secrets]
          cat << 'EOF' > .env
          NATS_HOST=${{ secrets.NATS_HOST }}
          NATS_PORT=${{ secrets.NATS_PORT }}
          KAFKA_KRAFT_CLUSTER_ID=${{ secrets.KAFKA_KRAFT_CLUSTER_ID }}
          KAFKA_BROKERS=${{ secrets.KAFKA_BROKERS }}
          GATEWAY_PORT=${{ secrets.GATEWAY_PORT }}
          GATEWAY_AUTH_GRPC_ADDR=${{ secrets.GATEWAY_AUTH_GRPC_ADDR }}
          GATEWAY_MATCHING_GRPC_ADDR=${{ secrets.GATEWAY_MATCHING_GRPC_ADDR }}
          GATEWAY_USER_GRPC_ADDR=${{ secrets.GATEWAY_USER_GRPC_ADDR }}
          GATEWAY_VEHICLE_GRPC_ADDR=${{ secrets.GATEWAY_VEHICLE_GRPC_ADDR }}
          GATEWAY_MEDIA_GRPC_ADDR=${{ secrets.GATEWAY_MEDIA_GRPC_ADDR }}
          AUTH_SERVICE_GRPC_PORT=${{ secrets.AUTH_SERVICE_GRPC_PORT }}
          AUTH_SERVICE_JWT_SECRET=${{ secrets.AUTH_SERVICE_JWT_SECRET }}
          AUTH_SERVICE_DB_DRIVER=${{ secrets.AUTH_SERVICE_DB_DRIVER }}
          AUTH_SERVICE_DB_HOST=${{ secrets.AUTH_SERVICE_DB_HOST }}
          AUTH_SERVICE_DB_PORT=${{ secrets.AUTH_SERVICE_DB_PORT }}
          AUTH_SERVICE_DB_USER=${{ secrets.AUTH_SERVICE_DB_USER }}
          AUTH_SERVICE_DB_PASSWORD=${{ secrets.AUTH_SERVICE_DB_PASSWORD }}
          AUTH_SERVICE_DB_NAME=${{ secrets.AUTH_SERVICE_DB_NAME }}
          AUTH_SERVICE_DB_ROOT_PASSWORD=${{ secrets.AUTH_SERVICE_DB_ROOT_PASSWORD }}
          AUTH_DB_REPLICATION_USER=${{ secrets.AUTH_DB_REPLICATION_USER }}
          AUTH_DB_REPLICATION_PASSWORD=${{ secrets.AUTH_DB_REPLICATION_PASSWORD }}
          AUTH_SERVICE_GOOGLE_CLIENT_ID=${{ secrets.AUTH_SERVICE_GOOGLE_CLIENT_ID }}
          AUTH_SERVICE_GOOGLE_CLIENT_SECRET=${{ secrets.AUTH_SERVICE_GOOGLE_CLIENT_SECRET }}
          AUTH_SERVICE_GOOGLE_REDIRECT_URL=${{ secrets.AUTH_SERVICE_GOOGLE_REDIRECT_URL }}
          MATCHING_SERVICE_GRPC_PORT=${{ secrets.MATCHING_SERVICE_GRPC_PORT }}
          MATCHING_SERVICE_DB_DRIVER=${{ secrets.MATCHING_SERVICE_DB_DRIVER }}
          MATCHING_DB_USER=${{ secrets.MATCHING_DB_USER }}
          MATCHING_DB_PASSWORD=${{ secrets.MATCHING_DB_PASSWORD }}
          MATCHING_DB_NAME=${{ secrets.MATCHING_DB_NAME }}
          MATCHING_DB_MASTER_HOST=${{ secrets.MATCHING_DB_MASTER_HOST }}
          MATCHING_DB_MASTER_PORT=${{ secrets.MATCHING_DB_MASTER_PORT }}
          MATCHING_DB_SLAVE_HOST=${{ secrets.MATCHING_DB_SLAVE_HOST }}
          MATCHING_DB_SLAVE_PORT=${{ secrets.MATCHING_DB_SLAVE_PORT }}
          MATCHING_DB_REPLICATION_USER=${{ secrets.MATCHING_DB_REPLICATION_USER }}
          MATCHING_DB_REPLICATION_PASSWORD=${{ secrets.MATCHING_DB_REPLICATION_PASSWORD }}
          MEDIA_SERVICE_GRPC_PORT=${{ secrets.MEDIA_SERVICE_GRPC_PORT }}
          MEDIA_SERVICE_CLOUDINARY_URL=${{ secrets.MEDIA_SERVICE_CLOUDINARY_URL }}
          USER_SERVICE_PORT=${{ secrets.USER_SERVICE_PORT }}
          USER_DB_USER=${{ secrets.USER_DB_USER }}
          USER_DB_PASSWORD=${{ secrets.USER_DB_PASSWORD }}
          USER_DB_HOST=${{ secrets.USER_DB_HOST }}
          USER_DB_PORT=${{ secrets.USER_DB_PORT }}
          USER_DB_NAME=${{ secrets.USER_DB_NAME }}
          USER_DB_REPLICATION_USER=${{ secrets.USER_DB_REPLICATION_USER }}
          USER_DB_REPLICATION_PASSWORD=${{ secrets.USER_DB_REPLICATION_PASSWORD }}
          VEHICLE_SERVICE_PORT=${{ secrets.VEHICLE_SERVICE_PORT }}
          VEHICLE_DB_USER=${{ secrets.VEHICLE_DB_USER }}
          VEHICLE_DB_PASSWORD=${{ secrets.VEHICLE_DB_PASSWORD }}
          VEHICLE_DB_HOST=${{ secrets.VEHICLE_DB_HOST }}
          VEHICLE_DB_PORT=${{ secrets.VEHICLE_DB_PORT }}
          VEHICLE_DB_NAME=${{ secrets.VEHICLE_DB_NAME }}
          VEHICLE_DB_REPLICATION_USER=${{ secrets.VEHICLE_DB_REPLICATION_USER }}
          VEHICLE_DB_REPLICATION_PASSWORD=${{ secrets.VEHICLE_DB_REPLICATION_PASSWORD }}
          OTEL_EXPORTER_OTLP_ENDPOINT=${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          EOF
          
          # Kích hoạt linger để các tiến trình của user ubuntu không bị kill khi SSH ngắt kết nối
          sudo loginctl enable-linger ubuntu

          chmod -R +x scripts/

          echo "Configuring Nginx with Cloudflare SSL..."
          sudo mkdir -p /etc/nginx/ssl
          echo "${{ secrets.CLOUDFLARE_CERT_PEM }}" | sudo tee /etc/nginx/ssl/cloudflare.pem > /dev/null
          echo "${{ secrets.CLOUDFLARE_CERT_KEY }}" | sudo tee /etc/nginx/ssl/cloudflare.key > /dev/null
          sudo chmod 600 /etc/nginx/ssl/cloudflare.key
          
          sudo cp nginx/logistic.conf /etc/nginx/sites-available/logistic
          sudo ln -sf /etc/nginx/sites-available/logistic /etc/nginx/sites-enabled/
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo nginx -t && sudo systemctl reload nginx
          
          # Nếu list Service cần Restart rỗng => Nghĩa là bạn commit linh tinh không dính đến source code
          if [ -z "$SERVICES_TO_RESTART" ]; then
            echo "No service changes detected. Skipping container restarts."
          else
            # Khởi động lại duy nhất những Service có thay đổi!
            echo "Restarting services: $SERVICES_TO_RESTART"
            podman-compose up -d --build $SERVICES_TO_RESTART
          fi

    # -------------------------------------------------------------
    # BƯỚC 9: Xóa IP của Github Runner khỏi Firewall để bảo mật
    # Lệnh `if: always()` đảm bảo bước này luôn chạy kể cả khi pipeline bị lỗi
    # -------------------------------------------------------------
    - name: Revoke Runner IP from Security Group
      if: always()
      run: |
        aws ec2 revoke-security-group-ingress \
          --group-id ${{ env.SG_ID }} \
          --protocol tcp \
          --port 22 \
          --cidr ${{ steps.ip.outputs.ipv4 }}/32
