name: 'Terraform Infrastructure Job'

on:
  push:
    branches: [ "main" ]
    paths:
      - 'terraform/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'terraform/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-network:
    name: 'Deploy Network'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform/network
    
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-southeast-1

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2

    - name: Terraform Init (Network)
      run: terraform init

    - name: Terraform Plan (Network)
      run: terraform plan
      env:
        TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        TF_VAR_aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        TF_VAR_aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        TF_VAR_aws_region: "ap-southeast-1"
        TF_VAR_cloudflare_zone_id: "f0234fb8217e4bc22ed940f54f915bdc"

    - name: Terraform Apply (Network)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: terraform apply -auto-approve
      env:
        TF_VAR_aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        TF_VAR_aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        TF_VAR_aws_region: "ap-southeast-1"

  deploy-compute:
    name: 'Deploy Compute'
    runs-on: ubuntu-latest
    needs: deploy-network
    defaults:
      run:
        working-directory: ./terraform/compute
    steps:
    - name: Checkout
      uses: actions/checkout@v3
        
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-southeast-1

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2

    - name: Terraform Init (Compute)
      run: terraform init

    - name: Terraform Plan (Compute)
      run: terraform plan
      env:
        TF_VAR_aws_logistic_key: ${{ secrets.LOGISTIC_KEY }} 
        TF_VAR_aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        TF_VAR_aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        TF_VAR_aws_instance_type: ${{ secrets.AWS_INSTANCE_TYPE }}
        TF_VAR_aws_region:  ${{ secrets.AWS_REGION }}

    - name: Terraform Apply (Compute)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: terraform apply -auto-approve
      env:
        TF_VAR_aws_logistic_key: ${{ secrets.LOGISTIC_KEY }} 
        TF_VAR_aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        TF_VAR_aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        TF_VAR_aws_instance_type: ${{ secrets.AWS_INSTANCE_TYPE }}
        TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
