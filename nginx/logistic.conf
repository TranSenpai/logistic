# ====================================================================
# FILE CẤU HÌNH NGINX REVERSE PROXY CHO LOGISTIC SYSTEM
# ====================================================================
# Cách dùng trên Server (Ubuntu):
# 1. sudo cp nginx/logistic.conf /etc/nginx/sites-available/logistic
# 2. sudo ln -s /etc/nginx/sites-available/logistic /etc/nginx/sites-enabled/
# 3. sudo rm -f /etc/nginx/sites-enabled/default
# 4. sudo nginx -t && sudo systemctl reload nginx
# ====================================================================

server {
    # Nginx lắng nghe ở cổng 80 và tự động chuyển hướng sang HTTPS
    listen 80;
    server_name gobackend.glolog.dev localhost;
    return 301 https://$host$request_uri;
}

server {
    # Nginx lắng nghe ở cổng 443 HTTPS
    listen 443 ssl;
    server_name gobackend.glolog.dev localhost; 

    # Đường dẫn tới chứng chỉ Cloudflare
    ssl_certificate /etc/nginx/ssl/cloudflare.pem;
    ssl_certificate_key /etc/nginx/ssl/cloudflare.key;

    # Cấu hình SSL an toàn cơ bản
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # -----------------------------------------------------------
    # API GATEWAY ROUTE: CHUYỂN TIẾP TOÀN BỘ TRAFFIC VÀO GATEWAY
    # Gateway sẽ đóng vai trò bóc tách URL và redirect sang các 
    # service nội bộ tương ứng.
    # -----------------------------------------------------------
    location / {
        proxy_pass http://localhost:8080/;
        
        # Cấu hình các Header để truyền IP thật của User vào cho Backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Tùy chọn nâng cao: Bật Gzip để nén dữ liệu API cho nhẹ
    gzip on;
    gzip_types application/json;
    gzip_min_length 1000;
}
