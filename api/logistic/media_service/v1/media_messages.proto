syntax = "proto3";

package logistic.media_service.v1;

option go_package = "github.com/logistic/api/logistic/media_service/v1;mediav1";

message UploadFileRequest {
  bytes file_content = 1;
  string file_name = 2;
  string folder = 3;
  string prefix = 4;
}

message UploadFileResponse {
  string file_name = 1;
  string public_id = 2;
  string url = 3;
  string message = 4;
}

message DeleteFileRequest {
  string public_id = 1;
}

message DeleteFileResponse {
  string message = 1;
}
