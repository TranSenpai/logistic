syntax = "proto3";
package logistic.wallet_service.v1;
option go_package = "github.com/logistic/api/logistic/wallet_service/v1;walletv1";

message GetBalanceReq {
    bytes user_id = 1;
}

message GetBalanceRes {
    int64 balance = 1;
    string currency = 2;
}

message DepositReq {
    bytes user_id = 1;
    int64 amount = 2;
    string description = 3;
}

message DepositRes {
    bytes transaction_id = 1;
    int64 new_balance = 2;
}

message TransferReq {
    bytes from_user_id = 1;
    bytes to_user_id = 2;
    int64 amount = 3;
    string reference_id = 4;
}

message TransferRes {
    bytes transaction_id = 1;
    bool success = 2;
}

message WalletInfo {
    bytes id = 1;
    bytes user_id = 2;
    uint32 user_type = 3;
    int64 balance = 4;
    string currency = 5;
    uint32 status = 6;
    string created_at = 7;
    string updated_at = 8;
}

message TransactionInfo {
    bytes id = 1;
    bytes wallet_id = 2;
    int64 amount = 3;
    uint32 transaction_type = 4;
    string reference_id = 5;
    string description = 6;
    uint32 status = 7;
    string created_at = 8;
}

message SearchWalletsReq {
    string query = 1;
    optional uint32 user_type = 2;
    optional uint32 status = 3;
    int32 page = 4;
    int32 page_size = 5;
}

message SearchWalletsRes {
    repeated WalletInfo wallets = 1;
    int64 total = 2;
    int32 page = 3;
    int32 page_size = 4;
}

message SearchTransactionsReq {
    string query = 1;
    optional bytes wallet_id = 2;
    optional uint32 transaction_type = 3;
    optional uint32 status = 4;
    optional string from_time = 5;
    optional string to_time = 6;
    int32 page = 7;
    int32 page_size = 8;
}

message SearchTransactionsRes {
    repeated TransactionInfo transactions = 1;
    int64 total = 2;
    int32 page = 3;
    int32 page_size = 4;
}
