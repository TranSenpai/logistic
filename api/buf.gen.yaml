version: v2
plugins:
  # Plugin sinh code Go cho các Struct
  - remote: buf.build/protocolbuffers/go
    out: ../api
    opt: paths=source_relative
  # Plugin sinh code gRPC Client/Server cho Go
  - remote: buf.build/grpc/go
    out: ../api
    opt: paths=source_relative
  # Plugin sinh code grpc-gateway (Reverse Proxy)
  - remote: buf.build/grpc-ecosystem/gateway
    out: ../api
    opt: paths=source_relative
  # Plugin sinh file Swagger/OpenAPI
  - remote: buf.build/grpc-ecosystem/openapiv2
    out: ../api/swagger